# ============================================================
# ESP32-P4 开发板 M1 —— 屏幕点亮测试
# ============================================================
# 目标   : ST7102 MIPI-DSI 480x800 点屏，显示 ESPHome 彩色测试卡
# 编译   : 仅需此单文件，无 secrets 依赖，可直接推 GitHub 在线编译
# ★ 必读 : 本配置用了 external_components 引入"打过补丁的 mipi_dsi"（见下方说明）。
#          推送 GitHub 时整个仓库都要提交（含 esphome/components/ 子目录）。
#          补丁原因：ESP32-P4 rev3.0+（本板 v3.2）与上游 mipi_dsi 已知不兼容，
#          会在 esp_lcd_new_dsi_bus() 内 abort。详见 驱动来源说明.md。
# 版本   : esphome >= 2026.9.0（更低版本另有别的兼容问题）
# 说明   : 工作区的 lcd_st7102/ 与 touch_st7123/ 是乐鑫官方 esp_lcd C 组件
#          （esp_lcd_new_panel_st7102_mipi / esp_lcd_touch_new_i2c_st7123），
#          没有 ESPHome 所需的 __init__.py schema，不能直接当 external_components。
#          ESPHome 的 mipi_dsi 组件已封装了同一套 IDF C API，无需也无法替换。
# 烧录   : USB 下载（本阶段无 WiFi —— WiFi 走 C6 协处理器，M1 不引入）
# 日志   : USB 串口 115200，重点看 mipi_dsi 初始化与 DSI 报错
# 通过   : 屏幕显示彩色测试卡（渐变+网格），无花屏/偏色/重影
# 后续   : 通过后关 show_test_card、update_interval 改 never，进 M2 触摸
# ============================================================
substitutions:
  name: p4-screen-test

esphome:
  name: ${name}
  # ★ 注意：不要在这里用长 delay 做测试序列 —— on_boot 的 delay 会阻塞
  #   主循环，而显示刷新（update_interval）是主循环驱动的，结果就是
  #   屏幕长时间得不到刷新 → 图形消失（已实测踩坑，见驱动来源说明.md）

# 本地外部组件：打补丁的 mipi_dsi
# 原因：ESP32-P4 rev 3.0+（本板 v3.2）会让上游 mipi_dsi 在 esp_lcd_new_dsi_bus()
# 内 abort —— 它硬编码了 .phy_clk_src = MIPI_DSI_PHY_CLK_SRC_DEFAULT(PLL_F20M)，
# 而 rev3.0+ 只接受 XTAL/APLL/CPLL/SPLL/MPLL，其余走 default: abort()。
# 上游修复 PR #18984（2026-09-05）删掉该赋值让 IDF 运行时自选，但尚未进 2026.9.0 发行版。
# 这里放一份打过补丁的副本，等上游发版后可删除。
external_components:
  - source:
      type: local
      path: components
    components: [mipi_dsi]

esp32:
  variant: esp32p4
  flash_size: 16MB
  # 显式 360MHz：缺省取 400MHz 会报"实验性可能无法启动"警告（issue #13425）
  cpu_frequency: 360MHz
  framework:
    type: esp-idf

# 片内 32MB hex PSRAM —— DSI 帧缓冲必须放这里
psram:
  mode: hex
  speed: 200MHz

# 片内 LDO 通道 3 输出 2.5V 供 MIPI DPHY
# （MicroPython screen.py 同款配置，板上已验证）
esp_ldo:
  - voltage: 2.5V
    channel: 3

output:
  # 背光 PWM：GPIO11
  # ★ 实测极性（2026-09-28）：GPIO11 = HIGH → 背光亮，LOW → 暗
  #   （自检序列 T6/T18 把脚拉高→亮，T0/T12 拉低→暗，四次全部吻合）
  #   因此 inverted 必须为 false（不反相：占空比越大 = 电平越高 = 越亮）
  - platform: ledc
    pin:
      number: GPIO11
      inverted: false
    id: backlight_pwm
    frequency: 1000Hz
    # 若调光无反应（只有亮/灭两态）→ 该脚可能只是背光 EN，改零阈值开关：
    #   - platform: gpio
    #     pin: {number: GPIO11, inverted: false}
    #     id: backlight_pwm

display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 480
      height: 800
    # ★★ 显示方向（2026-09-30 定论）：rotation: 270
    #
    # 一、为什么 90/270 只能走软件路径（必须知道，否则会误判）
    #   components/mipi_dsi/models/__init__.py 的 DsiDriverChip.transforms 做了
    #   `super().transforms - {CONF_SWAP_XY}` —— DSI 模型被强制移除 swap_xy。
    #   而 mipi/__init__.py 的 rotation_as_transform()：90 需 swap_xy∧mirror_x，
    #   270 需 swap_xy∧mirror_y → 因 swap_xy 被删，两者恒为假 → 走 C++ 软件旋转。
    #   只有 180（需 mirror_x∧mirror_y，这两个还在集合里）走 MADCTL 硬件路径。
    #   （注：软件路径本身是自洽的 —— draw_pixel_at 会做完整坐标映射，
    #    test_card() 用的是旋转感知的 get_width()/get_height()，不会错配。）
    #
    # 二、为什么是 270 而不是 90（两路交叉验证，不是猜）
    #   ① 色序修正后的干净观测：rotation 0 时画面需【顺时针】转 90° 才正。
    #   ② rotation 90 时观测到文字【倒置】(偏 180°) —— 该观测与颜色无关，可靠。
    #      由 0→90 偏移量增加 90° 可知：rotation 90 施加的是【逆时针】90°，
    #      与需要的方向相反；故 rotation 270 (= 顺时针 90°) 才是解。
    #   ③ 同族屏佐证：M5 Tab5（720x1280，同样横屏使用）用的就是 270。
    #
    # 三、历史误区（记下来避免重犯）
    #   之前 rotation 0 时曾判断"需逆时针 90°"，那是因为当时 color_order 未修、
    #   红蓝对调，用户据以判断方向的"红色带"其实是 B 带 → 方向判断被色序污染而反转。
    #   **判方向前必须先把 color_order 修对。**
    #
    # 四、如果这次仍然不对：看测试卡本身就能唯一定位
    #   R/G/B 三个字母 + 三条渐变带的方位直接指示当前偏转量，
    #   按 90/180/270 的整数倍报回来即可，不需要再试错。
    rotation: 270
    lanes: 2
    # ★★ 颜色顺序（2026-09-29 实锤）：必须显式写 RGB，否则红蓝对调（B 红 / R 蓝）
    #   根因链：
    #   1) display.py 里 CUSTOM 模型的 color_order 默认值是 MODE_BGR（不是 RGB）；
    #   2) mipi/__init__.py 的 get_madctl() 末尾：if color_order == BGR → madctl |= 0x08；
    #   3) 该 0x36=MADCTL 命令被 add_madctl() 追加进序列，【覆盖】厂商序列 0xB0 首字节
    #      隐含的色序设置（本板厂商序列 0xB0 = [0x22, 0x57, 0x1E, 0x61, 0x2F, 0x57, 0x61]）；
    #   4) 面板于是工作在 BGR 模式 → 逻辑红显示成物理蓝，逻辑蓝显示成物理红。
    #   官方 M5STACK-TAB5-ST7123 模型就是显式写 color_order="RGB"，且其序列不含 0xB0。
    #   注意：这一步与 rotation 无关，是独立的坑 —— 别指望换 rotation 能把颜色换回来。
    color_order: RGB
    # 500Mbps 为 screen.py 板级实测值（面板已验证可跑）
    # 注意：必须用 esphome 2026.9+ 编译 —— 2026-09-05 的 #18984 修复了
    # DPHY PLL 参考时钟选取，旧版(2025.11.5)在此处 abort 崩溃循环（已踩坑实测）
    lane_bit_rate: 500Mbps
    pclk_frequency: 36MHz
    # color_depth 不写 = 默认 16bit（RGB565），帧缓冲更省
    # 时序全部来自已跑通的 MicroPython screen.py（板级实测有效）
    hsync_back_porch: 40
    hsync_pulse_width: 2
    hsync_front_porch: 40
    vsync_back_porch: 10
    vsync_pulse_width: 2
    vsync_front_porch: 180
    reset_pin: GPIO21
    # ★★ 复位后黑屏的处置（2026-09-29）
    #   现象：上电（冷启动）能出图，按 RESET 键（热复位）屏幕亮但无图形。
    #   已知：display.py 里 init_sequence 是编译期 python 算好后
    #        cg.add(var.set_init_sequence(sequence)) 写进 C++ 变量的，复位后不变；
    #        mipi_dsi.cpp 的 reset 段（10ms/10ms 脉冲）在每次 setup() 都会跑。
    #   因此复位黑屏只剩两个可能：① 面板侧 TE 信号未重新同步
    #        ② 组件 setup() 里 init 命令流在热复位时未真正落屏。
    #   处置：把 TE 关掉（0x35 → 0x34）排除 ①；TE 只在面板主动回报刷新时才是必需的，
    #        ESPHome 走 esp_lcd_panel_draw_bitmap 主动推帧，本就不依赖 TE。
    show_test_card: true      # M1 验证用；点屏后关闭
    auto_clear_enabled: false
    update_interval: 1s       # 测试卡需要周期刷新；正式使用改 never
    # ST7102 厂商初始化序列（还原自乐鑫官方 esp_lcd_st7102 组件）
    # DCS 封包格式：[cmd, 参数...]
    init_sequence:
      - [0x99, 0x71, 0x02, 0xA2]
      - [0x99, 0x71, 0x02, 0xA3]
      - [0x99, 0x71, 0x02, 0xA4]
      - [0xA4, 0x31]
      - [0xB0, 0x22, 0x57, 0x1E, 0x61, 0x2F, 0x57, 0x61]
      - [0xB7, 0x64, 0x64]
      - [0xBF, 0xB4, 0xB4]
      - [0xC8, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xC9, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xD7, 0x10, 0x0C, 0x36, 0x19, 0x90, 0x90]
      - [0xA3, 0x51, 0x03, 0x80, 0xCF, 0x44, 0x00, 0x00, 0x00, 0x00, 0x04, 0x78, 0x78, 0x00, 0x1A, 0x00, 0x45, 0x05, 0x00, 0x00, 0x00, 0x00, 0x46, 0x00, 0x00, 0x02, 0x20, 0x52, 0x00, 0x05, 0x00, 0x00, 0xFF]
      - [0xA6, 0x02, 0x00, 0x24, 0x55, 0x35, 0x00, 0x38, 0x00, 0x78, 0x78, 0x00, 0x24, 0x55, 0x36, 0x00, 0x37, 0x00, 0x78, 0x78, 0x02, 0xAC, 0x51, 0x3A, 0x00, 0x00, 0x00, 0x78, 0x78, 0x03, 0xAC, 0x21, 0x00, 0x04, 0x00, 0x00, 0x78, 0x78, 0x3E, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0xA7, 0x19, 0x19, 0x00, 0x64, 0x40, 0x07, 0x16, 0x40, 0x00, 0x04, 0x03, 0x78, 0x78, 0x00, 0x64, 0x40, 0x25, 0x34, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x64, 0x40, 0x4B, 0x5A, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x24, 0x40, 0x69, 0x78, 0x00, 0x00, 0x00, 0x00, 0x78, 0x78, 0x00, 0x44]
      - [0xAC, 0x08, 0x0A, 0x11, 0x00, 0x13, 0x03, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0x09, 0x0B, 0x10, 0x02, 0x12, 0x01, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0xFF, 0x67, 0xFF, 0x67, 0x00]
      - [0xAD, 0xCC, 0x40, 0x46, 0x11, 0x04, 0x78, 0x78]
      - [0xE8, 0x30, 0x07, 0x00, 0x94, 0x94, 0x9C, 0x00, 0xE2, 0x04, 0x00, 0x00, 0x00, 0x00, 0xEF]
      - [0xE7, 0x8B, 0x3C, 0x00, 0x0C, 0xF0, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0xFF, 0x00, 0x08, 0x7B, 0x00, 0x00, 0xC8, 0x6A, 0x5A, 0x08, 0x1A, 0x3C, 0x00, 0x81, 0x01, 0xCC, 0x01, 0x7F, 0xF0, 0x22]
      - [0x35, 0x00]    # TE on（乐鑫原始序列末尾同款）
    # ★ 不要在此序列里写 0x11(SLPOUT)/0x29(DISPON)/延时 —— 组件会自动追加
    #   delay0+SLPOUT+10ms+DISPON+10ms（含 120ms 复位等待）。
    #   自己再写一遍 = 面板收到两套 Sleep-Out/Display-On 流程 → 显示异常（实测踩坑）。
    #   官方 M5STACK-TAB5-ST7123 模型的序列同样不含这两条命令。

# 正式配置（自检序列已移除 —— 它会阻塞主循环导致图形消失）

# 背光（display 之后声明 → 屏幕 init 完成后才点亮，对齐 MicroPython 顺序）
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "屏幕背光"
    # ★ ALWAYS_ON：不依赖 NVS 恢复，每次启动/复位都强制点亮
    #   （此前用 RESTORE_DEFAULT_ON 且 light 无 name → 复位后可能不亮）
    restore_mode: ALWAYS_ON

logger:
  level: DEBUG
