# ------------------------------------------------------------
# 触摸（原生坐标恒等；旋转由 LVGL 统一处理——Tab5 同款配法）
# ------------------------------------------------------------
touchscreen:
  - platform: st7123
    id: main_touch
    i2c_id: bus_a
    interrupt_pin: GPIO20
    reset_pin: GPIO13
    update_interval: never
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

# ------------------------------------------------------------
# 字体
#   icon_24        = Material Design Icons（本地 TTF，与 Tab5 同一款）
#   montserrat_72  = 大时钟（数字+冒号+"-"，占位符 --:-- 无框框）
#   montserrat_24  = 数值（IP/百分比）
#   noto_sans_sc_24= 中文标签（按需子集；缺字不报错）
# ------------------------------------------------------------
font:
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icon_24
    size: 24
    bpp: 4
    glyphs: [
      "\U000F02DC", # home
      "\U000F0493", # cog 设置
      "\U000F05A9", # wifi
      "\U000F109B", # home-assistant（API 连接）
      "\U000F06A5", # power-plug（USB 供电，本板无电池）
      "\U000F0451", # restart
    ]
  - file: gfonts://Montserrat@600
    id: montserrat_72
    size: 72
    bpp: 4
    glyphs: "0123456789:-"
  - file: gfonts://Montserrat@600
    id: montserrat_24
    size: 24
    bpp: 4
    glyphs: "0123456789.%:- dBm"
  - file: gfonts://Noto+Sans+SC
    id: noto_sans_sc_24
    size: 24
    bpp: 4
    glyphs: "显示亮度网络地址已未连接星期一二三四五六日0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz%:.()-_ "
    ignore_missing_glyphs: true

# ------------------------------------------------------------
# LVGL 界面（800×480 逻辑横屏；全部绝对定位，坐标系见文件头）
# ------------------------------------------------------------
lvgl:
  rotation: 270
  color_depth: 16
  byte_order: little_endian
  buffer_size: 10%
  on_boot:
    - script.execute: ui_sync_brightness
    - lambda: 'id(lvgl_ready) = true;'
  widgets:
    # ─────────────── 顶栏背景条（44px 白底；无布局语义）───────────────
    - obj:
        id: top_bar
        align: TOP_LEFT
        width: 100%
        height: 44
        bg_color: 0xFFFFFF
        bg_opa: COVER
        border_width: 0
        border_opa: TRANSP
        radius: 0
        widgets:
          # 图标钉在栏内右上角：x 间距 38px
          - label:
              id: api_icon
              hidden: true
              align: TOP_RIGHT
              x: -92
              y: 10
              text_font: icon_24
              text_color: 0x1A4A4A
              text: "\U000F109B"
          - label:
              id: wifi_icon
              hidden: true
              align: TOP_RIGHT
              x: -54
              y: 10
              text_font: icon_24
              text_color: 0x1A4A4A
              text: "\U000F05A9"
          - label:
              id: pwr_icon
              align: TOP_RIGHT
              x: -16
              y: 10
              text_font: icon_24
              text_color: 0x1A4A4A
              text: "\U000F06A5"
    # ─────────────── 中部：时钟 + 日期 + 星期（屏幕居中）───────────────
    - label:
        id: time_label
        align: CENTER
        y: -60
        text_font: montserrat_72
        text_color: 0x1A4A4A
        text: "--:--"
    - label:
        id: date_label
        align: CENTER
        y: 14
        text_font: noto_sans_sc_24
        text_color: 0x666666
        text: "----"
    # ─────────────── 左下：显示卡（372×108）───────────────
    # 卡内坐标系：标题 y6 / 分隔线 y40 / 第1行 y58 / 第2行 y94 ...
    - obj:
        id: card_display
        align: BOTTOM_LEFT
        x: 20
        y: -16
        width: 372
        height: 108
        bg_color: 0xFFFFFF
        bg_opa: COVER
        border_width: 1
        border_color: 0xE5E5E5
        border_opa: COVER
        radius: 12
        shadow_width: 0
        widgets:
          - label:
              align: TOP_LEFT
              x: 12
              y: 6
              text_font: noto_sans_sc_24
              text_color: 0x1A4A4A
              text: "显示"
          - obj:
              align: TOP_LEFT
              x: 12
              y: 40
              width: 348
              height: 1
              bg_color: 0xEEEEEE
              bg_opa: COVER
              border_width: 0
              border_opa: TRANSP
              radius: 0
          - label:
              align: TOP_LEFT
              x: 12
              y: 58
              text_font: noto_sans_sc_24
              text_color: 0x333333
              text: "亮度"
          - slider:
              id: backlight_slider
              align: TOP_LEFT
              x: 96
              y: 60
              width: 180
              height: 22
              min_value: 5      # 别给 0：全黑容易被当成死机
              max_value: 100
              value: 80
              bg_color: 0xECECEC
              bg_opa: COVER
              radius: 11
              indicator:
                radius: 11
                bg_color: 0xFF8C00
              knob:
                bg_opa: TRANSP
              on_release:
                - light.turn_on:
                    id: backlight
                    brightness: !lambda |-
                      return x / 100.0f;
          - label:
              id: brightness_value
              align: TOP_LEFT
              x: 288
              y: 58
              width: 72
              text_align: RIGHT
              text_font: montserrat_24
              text_color: 0x333333
              text: "80%"
    # ─────────────── 右下：网络卡（372×108，暂只留 IP；加行照头部坐标系）───────────────
    - obj:
        id: card_network
        align: BOTTOM_RIGHT
        x: -20
        y: -16
        width: 372
        height: 108
        bg_color: 0xFFFFFF
        bg_opa: COVER
        border_width: 1
        border_color: 0xE5E5E5
        border_opa: COVER
        radius: 12
        shadow_width: 0
        widgets:
          - label:
              align: TOP_LEFT
              x: 12
              y: 6
              text_font: noto_sans_sc_24
              text_color: 0x1A4A4A
              text: "网络"
          - obj:
              align: TOP_LEFT
              x: 12
              y: 40
              width: 348
              height: 1
              bg_color: 0xEEEEEE
              bg_opa: COVER
              border_width: 0
              border_opa: TRANSP
              radius: 0
          - label:
              align: TOP_LEFT
              x: 12
              y: 58
              text_font: noto_sans_sc_24
              text_color: 0x333333
              text: "IP地址"
          - label:
              id: ip_value
              align: TOP_LEFT
              x: 150
              y: 58
              width: 210
              text_align: RIGHT
              text_font: montserrat_24
              text_color: 0x333333
              text: "--"

# ------------------------------------------------------------
# 脚本
# ------------------------------------------------------------
script:
  # 时钟（SNTP 同步前显示占位符；"--:--" 所需字符全部在时钟字体子集里）
  - id: ui_update_clock
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            auto t = id(ntp_time).now();
            if (!t.is_valid())
              return std::string("--:--");
            return t.strftime("%H:%M");
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            auto t = id(ntp_time).now();
            if (!t.is_valid())
              return std::string("----");
            // ESPTime.day_of_week: 1=周日 .. 7=周六
            static const char *const WEEKDAY[] = {"星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"};
            char buf[16];
            snprintf(buf, sizeof(buf), "%04d-%02d-%02d", t.year, t.month, t.day_of_month);
            return std::string(buf) + " " + WEEKDAY[t.day_of_week - 1];
  # 背光滑块 ⇆ light 实际值双向同步（light.on_state 触发；lvgl_ready 保证 LVGL 已就绪）
  - id: ui_sync_brightness
    then:
      - lvgl.slider.update:
          id: backlight_slider
          value: !lambda |-
            if (!id(backlight).current_values.is_on())
              return 0;
            return (int) (id(backlight).current_values.get_brightness() * 100 + 0.5f);
      - lvgl.label.update:
          id: brightness_value
          text: !lambda |-
            if (!id(backlight).current_values.is_on())
              return std::string("0%");
            int pct = (int) (id(backlight).current_values.get_brightness() * 100 + 0.5f);
            return esphome::to_string(pct) + "%";

# ------------------------------------------------------------
# 开机竞态兜底：WiFi/API 可能先于 LVGL 就绪连上
# （之后的状态变化仍由 wifi/api 的触发器实时驱动；show 幂等，无副作用）
# ------------------------------------------------------------
interval:
  - interval: 5s
    then:
      - if:
          condition:
            - wifi.connected:
          then:
            - lvgl.widget.show: wifi_icon
      - if:
          condition:
            - api.connected:
          then:
            - lvgl.widget.show: api_icon
