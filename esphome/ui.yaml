# ------------------------------------------------------------
# 脚本
# ------------------------------------------------------------
script:
  - id: page_go_home
    then:
      - lvgl.widget.show: page_home
      - lvgl.widget.hide: page_settings
      - lvgl.label.update:
          id: page_title
          text: "主页"
  - id: page_go_settings
    then:
      - lvgl.widget.hide: page_home
      - lvgl.widget.show: page_settings
      - lvgl.label.update:
          id: page_title
          text: "设置"
  - id: ui_update_clock
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            auto t = id(ntp_time).now();
            if (!t.is_valid())
              return std::string("--:--");
            return t.strftime("%H:%M");
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            auto t = id(ntp_time).now();
            if (!t.is_valid())
              return std::string("----");
            // ESPTime.day_of_week: 1=周日 .. 7=周六
            static const char *const WEEKDAY[] = {"星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"};
            char buf[16];
            snprintf(buf, sizeof(buf), "%04d-%02d-%02d", t.year, t.month, t.day_of_month);
            return std::string(buf) + " " + WEEKDAY[t.day_of_week - 1];

# ------------------------------------------------------------
# 开机竞态兜底：WiFi/API 可能先于 LVGL 就绪连上
# （之后的状态变化仍由 wifi/api 的触发器实时驱动；show 幂等，无副作用）
# ------------------------------------------------------------
interval:
  - interval: 5s
    then:
      - if:
          condition:
            - wifi.connected:
          then:
            - lvgl.widget.show: wifi_icon
      - if:
          condition:
            - api.connected:
          then:
            - lvgl.widget.show: api_icon
