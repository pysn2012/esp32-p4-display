# ============================================================
# ESP32-P4 DFR1286 —— 主界面（M4 阶段，单页·上下式·绝对定位框架）
# ============================================================
# 布局（800×480 横屏，全部绝对定位，所见即所得）：
#   顶栏 44px：右上角 API / WiFi 图标（连接后才点亮）+ USB 供电图标（无电池）
#   中部   ：时间（大，屏幕水平居中）+ 日期 + 星期
#   底部   ：显示卡（亮度滑块）+ 网络卡（目前仅 IP 地址，后续加行）
#
# ★ 框架坐标系（加内容照这个加）：
#   顶栏 y 0..44；时钟块垂直居中一带 y≈140..270；两卡底边距屏 16px、高 108、行距 36
#   卡内行 y：标题 6 / 分隔线 40 / 第1行 58 / 第2行 94 / 第3行 130 ...（每行 +36）
#   左卡 align BOTTOM_LEFT x20；右卡 align BOTTOM_RIGHT x−20；卡宽 372
#
# ★ M4R3 教训：嵌套 flex（多层 obj 互相嵌套 + flex_align）在这块屏上没有按预期渲染
#   （时间挤在左上角 ⇒ 内层布局未生效），框架阶段全部改绝对定位，不再赌 flex 语义。
#
# WiFi：!secret + CI 动态生成 secrets.yaml（见 workflow Generate secrets.yaml 步骤）。
#   当前日志实况：C6 SDIO 初始化失败（sdmmc_card_init failed / ESP-Hosted link not yet up）
#   ⇒ 十有八九是 C6 里没有 esp-hosted slave 固件 —— UI 框架先行，WiFi 后面单独处理。
# 时间：SNTP，同步前显示 --:--（时钟字体子集含 "-"，无框框）。
# 亮度：gamma_correct: 0 ⇒ 滑块 % = PWM 占空比 = 实际亮度；light.on_state 双向同步。
# 编译：GitHub Actions（build esphome screentest → 选 ui.yaml）
# ============================================================
substitutions:
  test_round: "M4R4"
  test_round_desc: "UI 框架改绝对定位（M4R3 嵌套 flex 未生效）；网络卡暂只留 IP；布局坐标系写进头部注释"

esphome:
  name: p4-ui
  friendly_name: P4 Display UI
  project:
    name: p4.ui
    version: "${test_round}"
  on_boot:
    - priority: 600
      then:
        - logger.log:
            format: "===== BOOT CONFIG = P4 UI [${test_round}] ====="
            level: INFO
        - logger.log:
            format: "[${test_round}] ${test_round_desc}"
            level: INFO

external_components:
  - source:
      type: local
      path: components
    components: [mipi_dsi, st7123]

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# 片内 32MB hex PSRAM（LVGL 缓冲与 DSI 帧缓冲都靠它）
psram:
  mode: hex
  speed: 200MHz

# 片内 LDO 通道 3 输出 2.5V 供 MIPI DPHY
esp_ldo:
  - voltage: 2.5V
    channel: 3

# ------------------------------------------------------------
# ESP32-C6 WiFi 协处理器（ESP-Hosted，原理图第 7 页）
#   C6 SDIO 挂在 P4 的 SDMMC slot 0：CLK=GPIO18 CMD=GPIO19 D0~D3=GPIO14~17
#   C6_EN=GPIO5（R16 10K 上拉）、C6_WAKEUP=GPIO6（本组件未用）
#   ★ 当前实烧：SDIO card init failed ⇒ 查 C6 是否烧了 esp-hosted slave 固件
# ------------------------------------------------------------
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO5
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  slot: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "P4-UI-Setup"
    password: "12345678"
  on_connect:
    then:
      - lvgl.widget.show: wifi_icon
  on_disconnect:
    then:
      - lvgl.widget.hide: wifi_icon

captive_portal:

api:
  reboot_timeout: 0s
  on_client_connected:
    then:
      - lvgl.widget.show: api_icon
  on_client_disconnected:
    then:
      - lvgl.widget.hide: api_icon

ota:
  platform: esphome

logger:
  level: DEBUG

# ------------------------------------------------------------
# 公共 I2C 总线（触摸 ST7123 0x55；音频 ES8388 0x11 本阶段不启用）
# ------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

# ------------------------------------------------------------
# 时间：SNTP（时区上海）。同步前时钟显示 --:--
# ------------------------------------------------------------
time:
  - platform: sntp
    id: ntp_time
    timezone: Asia/Shanghai
    on_time_sync:
      then:
        - script.execute: ui_update_clock
    on_time:
      - seconds: /1
        then:
          - script.execute: ui_update_clock

# WiFi 信息（网络卡展示；后续要加行时再开更多 text_sensor）
text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_ts
      on_value:
        then:
          - lvgl.label.update:
              id: ip_value
              text: !lambda |-
                return x.empty() ? std::string("--") : x;

button:
  - platform: restart
    id: restart_button
    name: "重启设备"

# 开机时序无关的 UI 同步开关（LVGL 就绪后才允许 light.on_state 反向刷滑块）
globals:
  - id: lvgl_ready
    type: bool
    restore_value: no
    initial_value: 'false'

# ------------------------------------------------------------
# 背光（M1 定论：GPIO11，HIGH 亮）
# ★ gamma_correct: 0 ⇒ 滑块/状态里的百分比就是 PWM 占空比（缺省 2.8 会把 23% 抬到 ~60% 占空比）
# ------------------------------------------------------------
output:
  - platform: ledc
    pin:
      number: GPIO11
      inverted: false
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "屏幕背光"
    restore_mode: RESTORE_DEFAULT_ON
    gamma_correct: 0.0
    initial_state:
      brightness: 80%
    on_state:
      then:
        - if:
            condition:
              lambda: 'return id(lvgl_ready);'
            then:
              - script.execute: ui_sync_brightness

# ------------------------------------------------------------
# 显示（原生 480×800；rotation 归 LVGL；面板 10px 相位补偿在组件里）
# ------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 480
      height: 800
    # ★ LVGL 模式：display 层不许配 rotation（lvgl 组件校验会拒）——270° 旋转在下面 lvgl: 里
    color_order: RGB
    lane_bit_rate: 500Mbps
    pclk_frequency: 36MHz
    # porch 为厂商值（M1 实测改 porch 无效；10px 相位由组件 X_SHIFT 软件补偿）
    hsync_back_porch: 40
    hsync_pulse_width: 2
    hsync_front_porch: 40
    vsync_back_porch: 10
    vsync_pulse_width: 2
    vsync_front_porch: 180
    reset_pin: GPIO21
    show_test_card: false
    auto_clear_enabled: false
    update_interval: never
    # ST7102 厂商初始化序列（与 full_test.yaml 完全一致；组件自动追加 0x11/0x29，勿手写）
    init_sequence:
      - [0x99, 0x71, 0x02, 0xA2]
      - [0x99, 0x71, 0x02, 0xA3]
      - [0x99, 0x71, 0x02, 0xA4]
      - [0xA4, 0x31]
      - [0xB0, 0x22, 0x57, 0x1E, 0x61, 0x2F, 0x57, 0x61]
      - [0xB7, 0x64, 0x64]
      - [0xBF, 0xB4, 0xB4]
      - [0xC8, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
