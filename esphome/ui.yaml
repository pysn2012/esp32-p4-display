# ============================================================
# ESP32-P4 DFR1286 —— 主界面（M4 阶段，单页版）
# ============================================================
# 参考 M5 Tab5 的主页/设置页要素，整合为一页（800×480 横屏）：
#   顶栏：右上角 = API、WiFi 状态图标（连接后才点亮）+ USB 供电图标（本板无电池）
#   上部：时间（大）+ 日期 + 星期（横向通栏居中，Tab5 主页式）
#   下部：显示卡（背光亮度滑块）+ 网络卡（WiFi 名称/IP/信号/API 状态/重启）并排
#
# ★ 与 full_test.yaml 的显示架构差异（LVGL 模式硬约束，实核 lvgl/__init__.py 校验器）：
#   · display 层禁止配 rotation / lambda / auto_clear: true
#     ⇒ display 原生 480×800，rotation: 270 放在 lvgl: 下，触摸 transform 用原生恒等
#   · mipi_dsi 组件的 draw_pixels_at 已补 X_SHIFT 逐行补偿（M4R1），
#     否则 LVGL 界面整体偏 10px 且底部回绕到顶部
#
# WiFi  ：!secret —— 仓库里放 esphome/secrets.yaml：
#           wifi_ssid: "你的WiFi"
#           wifi_password: "你的密码"
#         C6 协处理器走 ESP-Hosted（SDIO slot 0 = GPIO14~19，EN=GPIO5）。
#         ★ 若 WiFi 一直连不上：确认 C6 里烧的是 esp-hosted slave 固件。
# 时间  ：SNTP（时区上海），同步前显示 --:--（时钟字体已含 "-"，不会再出框框）
# 亮度  ：gamma_correct: 0 ⇒ 滑块 % = PWM 占空比 = 实际亮度（缺省 2.8 时 23% 看着很亮）；
#         light.on_state 反向同步滑块，开机时序无关，滑块永远与实际一致
# 编译  ：GitHub Actions（build esphome screentest → 选 ui.yaml）
# ============================================================
substitutions:
  test_round: "M4R3"
  test_round_desc: "单页 UI 改上下式（Tab5 主页式）：时钟通栏在上，显示/网络两卡并排在下；其余同 M4R2"

esphome:
  name: p4-ui
  friendly_name: P4 Display UI
  project:
    name: p4.ui
    version: "${test_round}"
  on_boot:
    - priority: 600
      then:
        - logger.log:
            format: "===== BOOT CONFIG = P4 UI [${test_round}] ====="
            level: INFO
        - logger.log:
            format: "[${test_round}] ${test_round_desc}"
            level: INFO

external_components:
  - source:
      type: local
      path: components
    components: [mipi_dsi, st7123]

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# 片内 32MB hex PSRAM（LVGL 缓冲与 DSI 帧缓冲都靠它）
psram:
  mode: hex
  speed: 200MHz

# 片内 LDO 通道 3 输出 2.5V 供 MIPI DPHY
esp_ldo:
  - voltage: 2.5V
    channel: 3

# ------------------------------------------------------------
# ESP32-C6 WiFi 协处理器（ESP-Hosted，原理图第 7 页）
#   C6 SDIO 挂在 P4 的 SDMMC slot 0：CLK=GPIO18 CMD=GPIO19 D0~D3=GPIO14~17
#   C6_EN=GPIO5（R16 10K 上拉）、C6_WAKEUP=GPIO6（本组件未用）
#   （TF 卡在 slot 1 = GPIO39~45，与本组件无关）
# ------------------------------------------------------------
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO5
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  slot: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # 桌面 UI 板：离线不重启循环（要恢复缺省行为删掉这两行 0s）
  reboot_timeout: 0s
  ap:
    ssid: "P4-UI-Setup"
    password: "12345678"
  on_connect:
    then:
      - lvgl.widget.show: wifi_icon
  on_disconnect:
    then:
      - lvgl.widget.hide: wifi_icon

captive_portal:

api:
  reboot_timeout: 0s
  on_client_connected:
    then:
      - lvgl.widget.show: api_icon
      - lvgl.label.update:
          id: api_state
          text: "已连接"
  on_client_disconnected:
    then:
      - lvgl.widget.hide: api_icon
      - lvgl.label.update:
          id: api_state
          text: "未连接"

ota:
  platform: esphome

logger:
  level: DEBUG

# ------------------------------------------------------------
# 公共 I2C 总线（触摸 ST7123 0x55；音频 ES8388 0x11 本阶段不启用）
# ------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

# ------------------------------------------------------------
# 时间：SNTP（时区上海）。同步前时钟显示 --:--
# ------------------------------------------------------------
time:
  - platform: sntp
    id: ntp_time
    timezone: Asia/Shanghai
    on_time_sync:
      then:
        - script.execute: ui_update_clock
    on_time:
      - seconds: /1
        then:
          - script.execute: ui_update_clock

# WiFi 信息（网络卡展示）
text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_ts
      on_value:
        then:
          - lvgl.label.update:
              id: ip_value
              text: !lambda |-
                return x.empty() ? std::string("--") : x;
    ssid:
      id: ssid_ts
      on_value:
        then:
          - lvgl.label.update:
              id: ssid_value
              text: !lambda |-
                return x.empty() ? std::string("--") : x;

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    update_interval: 30s
    on_value:
      then:
        - lvgl.label.update:
            id: rssi_value
            text: !lambda |-
              if (isnan(x))
                return std::string("-- dBm");
              char buf[16];
              snprintf(buf, sizeof(buf), "%.0f dBm", x);
              return std::string(buf);

button:
  - platform: restart
    id: restart_button
    name: "重启设备"

# 开机时序无关的 UI 同步开关（LVGL 就绪后才允许 light.on_state 反向刷滑块）
globals:
  - id: lvgl_ready
    type: bool
    restore_value: no
    initial_value: 'false'

# ------------------------------------------------------------
# 背光（M1 定论：GPIO11，HIGH 亮）
# ★ gamma_correct: 0 ⇒ 滑块/状态里的 23% 就是 PWM 23%（缺省 2.8 会把 23% 抬到 ~60% 占空比）
# ------------------------------------------------------------
output:
  - platform: ledc
    pin:
      number: GPIO11
      inverted: false
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "屏幕背光"
    restore_mode: RESTORE_DEFAULT_ON
    gamma_correct: 0.0
    initial_state:
      brightness: 80%
    on_state:
      then:
        - if:
            condition:
              lambda: 'return id(lvgl_ready);'
            then:
              - script.execute: ui_sync_brightness

# ------------------------------------------------------------
# 显示（原生 480×800；rotation 归 LVGL；面板 10px 相位补偿在组件里）
# ------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 480
      height: 800
    # ★ LVGL 模式：display 层不许配 rotation（lvgl 组件校验会拒）——270° 旋转在下面 lvgl: 里
    color_order: RGB
    lane_bit_rate: 500Mbps
    pclk_frequency: 36MHz
    # porch 为厂商值（M1 实测改 porch 无效；10px 相位由组件 X_SHIFT 软件补偿）
    hsync_back_porch: 40
    hsync_pulse_width: 2
    hsync_front_porch: 40
    vsync_back_porch: 10
    vsync_pulse_width: 2
    vsync_front_porch: 180
    reset_pin: GPIO21
    show_test_card: false
    auto_clear_enabled: false
    update_interval: never
    # ST7102 厂商初始化序列（与 full_test.yaml 完全一致；组件自动追加 0x11/0x29，勿手写）
    init_sequence:
      - [0x99, 0x71, 0x02, 0xA2]
      - [0x99, 0x71, 0x02, 0xA3]
      - [0x99, 0x71, 0x02, 0xA4]
      - [0xA4, 0x31]
      - [0xB0, 0x22, 0x57, 0x1E, 0x61, 0x2F, 0x57, 0x61]
      - [0xB7, 0x64, 0x64]
      - [0xBF, 0xB4, 0xB4]
      - [0xC8, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xC9, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xD7, 0x10, 0x0C, 0x36, 0x19, 0x90, 0x90]
      - [0xA3, 0x51, 0x03, 0x80, 0xCF, 0x44, 0x00, 0x00, 0x00, 0x00, 0x04, 0x78, 0x78, 0x00, 0x1A, 0x00, 0x45, 0x05, 0x00, 0x00, 0x00, 0x00, 0x46, 0x00, 0x00, 0x02, 0x20, 0x52, 0x00, 0x05, 0x00, 0x00, 0xFF]
      - [0xA6, 0x02, 0x00, 0x24, 0x55, 0x35, 0x00, 0x38, 0x00, 0x78, 0x78, 0x00, 0x24, 0x55, 0x36, 0x00, 0x37, 0x00, 0x78, 0x78, 0x02, 0xAC, 0x51, 0x3A, 0x00, 0x00, 0x00, 0x78, 0x78, 0x03, 0xAC, 0x21, 0x00, 0x04, 0x00, 0x00, 0x78, 0x78, 0x3E, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0xA7, 0x19, 0x19, 0x00, 0x64, 0x40, 0x07, 0x16, 0x40, 0x00, 0x04, 0x03, 0x78, 0x78, 0x00, 0x64, 0x40, 0x25, 0x34, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x64, 0x40, 0x4B, 0x5A, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x24, 0x40, 0x69, 0x78, 0x00, 0x00, 0x00, 0x00, 0x78, 0x78, 0x00, 0x44]
      - [0xAC, 0x08, 0x0A, 0x11, 0x00, 0x13, 0x03, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0x09, 0x0B, 0x10, 0x02, 0x12, 0x01, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0xFF, 0x67, 0xFF, 0x67, 0x00]
      - [0xAD, 0xCC, 0x40, 0x46, 0x11, 0x04, 0x78, 0x78]
      - [0xE8, 0x30, 0x07, 0x00, 0x94, 0x94, 0x9C, 0x00, 0xE2, 0x04, 0x00, 0x00, 0x00, 0x00, 0xEF]
      - [0xE7, 0x8B, 0x3C, 0x00, 0x0C, 0xF0, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0xFF, 0x00, 0x08, 0x7B, 0x00, 0x00, 0xC8, 0x6A, 0x5A, 0x08, 0x1A, 0x3C, 0x00, 0x81, 0x01, 0xCC, 0x01, 0x7F, 0xF0, 0x22]
      - [0x35, 0x00]

# ------------------------------------------------------------
# 触摸（原生坐标恒等；旋转由 LVGL 统一处理——Tab5 同款配法）
# ------------------------------------------------------------
touchscreen:
  - platform: st7123
    id: main_touch
    i2c_id: bus_a
    interrupt_pin: GPIO20
    reset_pin: GPIO13
    update_interval: never
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

# ------------------------------------------------------------
# 字体（M4R2 全面调小）
#   icon_24        = Material Design Icons（本地 TTF，与 Tab5 同一款）
#   montserrat_72  = 大时钟（数字+冒号+"-"，占位符 --:-- 不再出框框）
#   montserrat_24  = 数值（IP/百分比/dBm）
#   noto_sans_sc_24= 中文标签（按需子集；SSID 可能含任意字符 ⇒ ignore_missing）
# ------------------------------------------------------------
font:
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icon_24
    size: 24
    bpp: 4
    glyphs: [
      "\U000F02DC", # home
      "\U000F0493", # cog 设置
      "\U000F05A9", # wifi
      "\U000F109B", # home-assistant（API 连接）
      "\U000F06A5", # power-plug（USB 供电，本板无电池）
      "\U000F0451", # restart
    ]
  - file: gfonts://Montserrat@600
    id: montserrat_72
    size: 72
    bpp: 4
    glyphs: "0123456789:-"
  - file: gfonts://Montserrat@600
    id: montserrat_24
    size: 24
    bpp: 4
    glyphs: "0123456789.%:- dBm"
  - file: gfonts://Noto+Sans+SC
    id: noto_sans_sc_24
    size: 24
    bpp: 4
    glyphs: "显示亮度网络名称地址信号强状态已未连接重启设备星期一二三四五六日0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz%:.()-_ "
    ignore_missing_glyphs: true

# ------------------------------------------------------------
# LVGL 界面（800×480 逻辑横屏，单页）
# ------------------------------------------------------------
lvgl:
  rotation: 270
  color_depth: 16
  byte_order: little_endian
  buffer_size: 10%
  on_boot:
    # 与背光实际值对齐（light 恢复完成后运行；此后由 on_state 持续同步）
    - script.execute: ui_sync_brightness
    - lambda: 'id(lvgl_ready) = true;'
  style_definitions:
    - id: ui_card
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_width: 1
      border_color: 0xE5E5E5
      border_opa: COVER
      radius: 12
      pad_all: 10
      shadow_width: 0
    - id: ui_module_title
      text_font: noto_sans_sc_24
      text_color: 0x1A4A4A
      bg_opa: TRANSP
    - id: ui_divider
      bg_color: 0xEEEEEE
      bg_opa: COVER
      height: 1
      width: 100%
    - id: ui_row
      bg_opa: TRANSP
      border_opa: TRANSP
      border_width: 0
      radius: 0
      width: 100%
      height: SIZE_CONTENT
    - id: ui_label
      text_font: noto_sans_sc_24
      text_color: 0x333333
      bg_opa: TRANSP
    - id: ui_value
      text_font: montserrat_24
      text_color: 0x333333
      bg_opa: TRANSP
  widgets:
    # ─────────────── 顶栏（44px，状态图标靠右）───────────────
    - obj:
        id: top_bar
        align: TOP_LEFT
        width: 100%
        height: 44
        bg_color: 0xFFFFFF
        bg_opa: COVER
        border_width: 0
        border_opa: TRANSP
        radius: 0
        pad_left: 16
        pad_right: 16
        pad_top: 6
        pad_bottom: 6
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: START
          flex_align_cross: CENTER
          pad_column: 14
        widgets:
          - obj:
              bg_opa: TRANSP
              border_opa: TRANSP
              border_width: 0
              radius: 0
              flex_grow: 1
              height: 1
          - label:
              id: api_icon
              hidden: true
              text_font: icon_24
              text_color: 0x1A4A4A
              text: "\U000F109B"
          - label:
              id: wifi_icon
              hidden: true
              text_font: icon_24
              text_color: 0x1A4A4A
              text: "\U000F05A9"
          - label:
              id: pwr_icon
              text_font: icon_24
              text_color: 0x1A4A4A
              text: "\U000F06A5"
    # ─────────────── 主区（上：时钟通栏；下：两卡并排）───────────────
    - obj:
        id: main_area
        align: TOP_LEFT
        y: 44
        width: 100%
        height: 436
        bg_color: 0xF5F5F5
        bg_opa: COVER
        border_width: 0
        border_opa: TRANSP
        radius: 0
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: START
          flex_align_cross: CENTER
          pad_row: 12
        pad_left: 20
        pad_right: 20
        pad_top: 12
        pad_bottom: 12
        widgets:
          # ── 上：时间 / 日期 / 星期（通栏居中）──
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_opa: TRANSP
              border_width: 0
              radius: 0
              layout:
                type: FLEX
                flex_flow: COLUMN
                flex_align_main: CENTER
                flex_align_cross: CENTER
                pad_row: 10
              widgets:
                - label:
                    id: time_label
                    text_font: montserrat_72
                    text_color: 0x1A4A4A
                    text: "--:--"
                - label:
                    id: date_label
                    text_font: noto_sans_sc_24
                    text_color: 0x666666
                    text: "----"
          # ── 下：显示卡 + 网络卡 并排 ──
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_opa: TRANSP
              border_width: 0
              radius: 0
              layout:
                type: FLEX
                flex_flow: ROW
                flex_align_cross: CENTER
                pad_column: 16
              widgets:
                # ── 显示卡 ──
                - obj:
                    styles: ui_card
                    flex_grow: 1
                    height: SIZE_CONTENT
                    layout:
                      type: FLEX
                      flex_flow: COLUMN
                      pad_row: 8
                    widgets:
                      - label:
                          styles: ui_module_title
                          text: "显示"
                      - obj:
                          styles: ui_divider
                      - obj:
                          styles: ui_row
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_cross: CENTER
                            pad_column: 10
                          widgets:
                            - label:
                                styles: ui_label
                                text: "亮度"
                                flex_grow: 1
                            - slider:
                                id: backlight_slider
                                width: 170
                                height: 22
                                min_value: 5      # 别给 0：全黑容易被当成死机
                                max_value: 100
                                value: 80
                                bg_color: 0xECECEC
                                bg_opa: COVER
                                radius: 11
                                indicator:
                                  radius: 11
                                  bg_color: 0xFF8C00
                                knob:
                                  bg_opa: TRANSP
                                on_release:
                                  - light.turn_on:
                                      id: backlight
                                      brightness: !lambda |-
                                        return x / 100.0f;
                            - label:
                                id: brightness_value
                                styles: ui_value
                                width: 64
                                text_align: RIGHT
                                text: "80%"
                # ── 网络卡 ──
                - obj:
                    styles: ui_card
                    flex_grow: 1
                    height: SIZE_CONTENT
                    layout:
                      type: FLEX
                      flex_flow: COLUMN
                      pad_row: 6
                    widgets:
                      - label:
                          styles: ui_module_title
                          text: "网络"
                      - obj:
                          styles: ui_divider
                      - obj:
                          styles: ui_row
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_cross: CENTER
                            pad_column: 10
                          widgets:
                            - label:
                                styles: ui_label
                                text: "WiFi名称"
                                flex_grow: 1
                            - label:
                                id: ssid_value
                                text_font: noto_sans_sc_24
                                text_color: 0x333333
                                bg_opa: TRANSP
                                width: 190
                                text_align: RIGHT
                                text: "--"
                      - obj:
                          styles: ui_row
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_cross: CENTER
                            pad_column: 10
                          widgets:
                            - label:
                                styles: ui_label
                                text: "IP地址"
                                flex_grow: 1
                            - label:
                                id: ip_value
                                styles: ui_value
                                width: 190
                                text_align: RIGHT
                                text: "--"
                      - obj:
                          styles: ui_row
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_cross: CENTER
                            pad_column: 10
                          widgets:
                            - label:
                                styles: ui_label
                                text: "信号强度"
                                flex_grow: 1
                            - label:
                                id: rssi_value
                                styles: ui_value
                                width: 190
                                text_align: RIGHT
                                text: "-- dBm"
                      - obj:
                          styles: ui_row
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_cross: CENTER
                            pad_column: 10
                          widgets:
                            - label:
                                styles: ui_label
                                text: "API状态"
                                flex_grow: 1
                            - label:
                                id: api_state
                                text_font: noto_sans_sc_24
                                text_color: 0x333333
                                bg_opa: TRANSP
                                width: 190
                                text_align: RIGHT
                                text: "未连接"
                      - obj:
                          styles: ui_row
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_cross: CENTER
                            pad_column: 10
                          widgets:
                            - label:
                                styles: ui_label
                                text: "重启设备"
                                flex_grow: 1
                            - button:
                                id: btn_restart
                                width: 110
                                height: 34
                                radius: 8
                                bg_color: 0xE74C3C
                                bg_opa: COVER
                                border_opa: TRANSP
                                shadow_opa: TRANSP
                                on_press:
                                  - button.press: restart_button
                                widgets:
                                  - label:
                                      text_font: noto_sans_sc_24
                                      text: "重启"
                                      align: CENTER
                                      text_color: 0xFFFFFF

# ------------------------------------------------------------
# 脚本
# ------------------------------------------------------------
script:
  # 时钟（SNTP 同步前显示占位符；"--:--" 所需字符全部在时钟字体子集里）
  - id: ui_update_clock
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            auto t = id(ntp_time).now();
            if (!t.is_valid())
              return std::string("--:--");
            return t.strftime("%H:%M");
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            auto t = id(ntp_time).now();
            if (!t.is_valid())
              return std::string("----");
            // ESPTime.day_of_week: 1=周日 .. 7=周六
            static const char *const WEEKDAY[] = {"星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"};
            char buf[16];
            snprintf(buf, sizeof(buf), "%04d-%02d-%02d", t.year, t.month, t.day_of_month);
            return std::string(buf) + " " + WEEKDAY[t.day_of_week - 1];
  # 背光滑块 ⇆ light 实际值双向同步（light.on_state 触发；lvgl_ready 保证 LVGL 已就绪）
  - id: ui_sync_brightness
    then:
      - lvgl.slider.update:
          id: backlight_slider
          value: !lambda |-
            if (!id(backlight).current_values.is_on())
              return 0;
            return (int) (id(backlight).current_values.get_brightness() * 100 + 0.5f);
      - lvgl.label.update:
          id: brightness_value
          text: !lambda |-
            if (!id(backlight).current_values.is_on())
              return std::string("0%");
            int pct = (int) (id(backlight).current_values.get_brightness() * 100 + 0.5f);
            return esphome::to_string(pct) + "%";

# ------------------------------------------------------------
# 开机竞态兜底：WiFi/API 可能先于 LVGL 就绪连上
# （之后的状态变化仍由 wifi/api 的触发器实时驱动；show 幂等，无副作用）
# ------------------------------------------------------------
interval:
  - interval: 5s
    then:
      - if:
          condition:
            - wifi.connected:
          then:
            - lvgl.widget.show: wifi_icon
      - if:
          condition:
            - api.connected:
          then:
            - lvgl.widget.show: api_icon
