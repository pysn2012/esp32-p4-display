# ============================================================
# ESP32-P4 DFR1286 —— 主界面（M4 阶段，单页·上下式·绝对定位框架）
# ============================================================
# 布局（800×480 横屏，全部绝对定位，所见即所得）：
#   顶栏 44px：右上角 API / WiFi 图标（连接后才点亮）+ USB 供电图标（无电池）
#   中部   ：时间（大，屏幕水平居中）+ 日期 + 星期
#   底部   ：显示卡（亮度滑块）+ 网络卡（目前仅 IP 地址，后续加行）
#
# ★ 框架坐标系（加内容照这个加）：
#   顶栏 y 0..44；时钟块垂直居中一带 y≈140..270；两卡底边距屏 40px、高 108、行距 36
#   卡内行 y：标题 6 / 分隔线 40 / 第1行 58 / 第2行 94 / 第3行 130 ...（每行 +36）
#   左卡 align BOTTOM_LEFT x20；右卡 align BOTTOM_RIGHT x−20；卡宽 372
#
# ★ M4R3 教训：嵌套 flex（多层 obj 互相嵌套 + flex_align）在这块屏上没有按预期渲染
#   （时间挤在左上角 ⇒ 内层布局未生效），框架阶段全部改绝对定位，不再赌 flex 语义。
#
# 模块化（M4R6，参考 Tab5）：硬件/字体/界面/时间/脚本/传感器/系统 拆在 packages/ 下，
#   wifi / api / captive_portal / ota / logger 留在本文件（每块板基本只有一份）。
# WiFi：!secret + CI 动态生成 secrets.yaml（workflow Generate secrets.yaml 步骤）。
#   M4R6 修复 SDIO slot 0→1（详见 packages/hardware.yaml 内注释）。
# 时间：SNTP，同步前显示 --:--（时钟字体子集含 "-"，无框框）。
# 亮度：gamma_correct: 0 ⇒ 滑块 % = PWM 占空比 = 实际亮度；light.on_state 双向同步。
# 编译：GitHub Actions（build esphome screentest → 选 ui.yaml）
# ============================================================
substitutions:
  test_round: "M4R7"
  test_round_desc: "显示校准：vsync_back_porch 10→78（面板 VSYNC 后 ~68 行才开窗，帧头被吞=整体左移68）；两卡底边距 16→40"

esphome:
  name: p4-ui
  friendly_name: P4 Display UI
  project:
    name: p4.ui
    version: "${test_round}"
  on_boot:
    - priority: 600
      then:
        - logger.log:
            format: "===== BOOT CONFIG = P4 UI [${test_round}] ====="
            level: INFO
        - logger.log:
            format: "[${test_round}] ${test_round_desc}"
            level: INFO

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "P4-UI-Setup"
    password: "12345678"
  on_connect:
    then:
      - lvgl.widget.show: wifi_icon
  on_disconnect:
    then:
      - lvgl.widget.hide: wifi_icon

captive_portal:

api:
  reboot_timeout: 0s
  on_client_connected:
    then:
      - lvgl.widget.show: api_icon
  on_client_disconnected:
    then:
      - lvgl.widget.hide: api_icon

ota:
  platform: esphome

# ------------------------------------------------------------
# 模块化配置（各文件头部有独立注释）
# ------------------------------------------------------------
packages:
  hardware: !include packages/hardware.yaml
  fonts:    !include packages/fonts.yaml
  lvgl:     !include packages/lvgl.yaml
  time:     !include packages/time.yaml
  script:   !include packages/script.yaml
  sensor:   !include packages/sensor.yaml
  system:   !include packages/system.yaml
