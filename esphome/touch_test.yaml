# ============================================================
# ESP32-P4 开发板 M2 —— 触摸验证
# ============================================================
# 目标   : ST7123 电容触摸（I2C 0x55）读坐标，并与显示坐标对齐
# 前置   : M1 已通过（screen_test.yaml）。本文件完整保留 M1 的显示配置，
#          只在其上叠加触摸 —— 显示侧任何参数都不再改动。
# 编译   : 单文件，无 secrets 依赖。CI workflow 里选 touch_test.yaml
# ★ 必读 : 本配置用 external_components 引入两个本地组件（推仓库时
#          esphome/components/ 整个目录都要提交）：
#            - mipi_dsi : 打过补丁（P4 rev3.0+ 的 DPHY PLL 时钟源会 abort）
#            - st7123   : 触摸驱动，非 ESPHome 上游组件，来自 M5 Tab5 工程
# 硬件   : I2C  SDA=GPIO7  SCL=GPIO8（与 ES8388 / BMI323 共用总线）
#          触摸 TP_INT=GPIO20   TP_RST=GPIO13
# 通过   : 手指点屏幕任意位置，黄点出现在手指正下方（不偏不斜）；
#          依次点四角，黄点分别落在对应角（绿=左上 红=右上 蓝=左下 白=右下）
# ============================================================
substitutions:
  name: p4-touch-test

esphome:
  name: ${name}
  # ★ 开机横幅（2026-09-30 加）：日志第一屏就能确认烧进去的是哪个配置。
  #   教训 —— 曾把 M1 的 screen_test 固件当成 M2 固件烧进去，整个日志里
  #   没有任何 i2c / touchscreen 记录才发觉。有这一行就一眼可辨。
  #   priority 600 = 组件 setup 完成、logger 已就绪之后（不改变启动时序）。
  on_boot:
    priority: 600
    then:
      - logger.log:
          format: "===== BOOT CONFIG = M2 touch_test ====="
          level: INFO
  # ★ 不要在这里放长 delay —— on_boot 的 delay 会阻塞主循环，
  #   而显示刷新（update_interval）是主循环驱动的，结果就是屏幕长时间
  #   得不到刷新 → 图形消失（M1 已实测踩坑，见 驱动来源说明.md）

external_components:
  - source:
      type: local
      path: components
    components: [mipi_dsi, st7123]

esp32:
  variant: esp32p4
  flash_size: 16MB
  # 显式 360MHz：缺省取 400MHz 会报"实验性可能无法启动"警告
  cpu_frequency: 360MHz
  framework:
    type: esp-idf

# 片内 32MB hex PSRAM —— DSI 帧缓冲必须放这里
psram:
  mode: hex
  speed: 200MHz

# 片内 LDO 通道 3 输出 2.5V 供 MIPI DPHY
esp_ldo:
  - voltage: 2.5V
    channel: 3

# ------------------------------------------------------------
# I2C 总线（M2 新增）
# 原理图 V0.0.2：SDA=GPIO7，SCL=GPIO8 —— 触摸/音频/IMU 共用一条总线
# scan: true 启动时会扫描并打印在线从机地址，用来确认 0x55 是否应答。
# 注意：其余挂在这条总线上的器件（ES8388 等）M2 一律不配置，避免干扰。
# ------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

output:
  # 背光 PWM：GPIO11
  # ★ M1 实测极性：GPIO11 = HIGH → 背光亮，LOW → 暗，故 inverted: false
  - platform: ledc
    pin:
      number: GPIO11
      inverted: false
    id: backlight_pwm
    frequency: 1000Hz

# ------------------------------------------------------------
# 触摸落点缓存（M2 新增）
# display 的 lambda 每帧读取这两个值决定黄点画在哪；-1 表示尚未触摸
# ------------------------------------------------------------
globals:
  - id: last_touch_x
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_touch_y
    type: int
    restore_value: no
    initial_value: '-1'

display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 480
      height: 800
    # ★ M1 定论：rotation 270（= 用户视角顺时针 90°），走 C++ 软件路径。
    #   DSI 模型被强制移除 swap_xy（DsiDriverChip.transforms 做 `- {CONF_SWAP_XY}`），
    #   故 90/270 的 rotation_as_transform() 恒为假 → 只能软件旋转；180 才走硬件。
    #   软件路径本身自洽（draw_pixel_at 做完整坐标映射）。详见 screen_test.yaml。
    rotation: 270
    lanes: 2
    # ★ M1 定论：必须显式写 RGB。CUSTOM 模型默认是 BGR，
    #   会让 get_madctl() 追加 0x36=0x08，覆盖厂商序列 0xB0 隐含的色序 → 红蓝对调。
    color_order: RGB
    # 500Mbps / 36MHz / 下列时序均为 screen.py 板级实测值
    lane_bit_rate: 500Mbps
    pclk_frequency: 36MHz
    # color_depth 不写 = 默认 16bit（RGB565）
    # ★★ 2026-10-01 实测定性后修正：hsync_back_porch 40 → 30
    #   现象：整幅画面沿"逻辑 y 方向"（= 面板 H 方向）向下偏约 10px 并回绕 ——
    #        屏幕最上沿那条约 10px 的一条，露出的是画面最底部的内容
    #        （左下蓝/右下白方块的下沿，约 40px 方块的 1/4）。
    #   原理：面板以自己的 back porch 相对 HSYNC 边沿开窗；我们的有效数据起点
    #        = hsync_pulse(2) + hsync_back_porch(40) = 42 clk。数据来得偏晚
    #        ⇒ 面板窗口先开 ⇒ 窗口最前 10 列抓到的是上一行的尾巴，
    #        而我们的第 0 列落到窗口第 10 列 ⇒ 画面整体向 +px 平移 10px 并回绕。
    #   方向：back porch 减小 = 数据提前 = 画面往"上"移；减小 10 正好抵消。
    #   ⚠ 这组时序原本抄自乐鑫 esp_lcd_st7102.h 的 TL043WVV02-B1900A，
    #     而那块是 480×272 面板，本板是 480×800 ⇒ 厂商值不通用，此处按实测反推。
    hsync_back_porch: 30
    hsync_pulse_width: 2
    hsync_front_porch: 40
    vsync_back_porch: 10
    vsync_pulse_width: 2
    vsync_front_porch: 180
    reset_pin: GPIO21
    # ★ M1 定论：面板复位释放后必须留够 settle 时间。
    #   已在 components/mipi_dsi/mipi_dsi.cpp 补丁里改为
    #   「低脉冲 20ms + 释放后 delay(120)」，解决"上电有图、按 RESET 无图"。
    show_test_card: false     # M2 不再用测试卡，改画触摸可视化
    auto_clear_enabled: true  # 每帧自动清屏，lambda 里不必自己 fill
    update_interval: 100ms    # 轮询刷新（约 10fps），保证触摸点即时可见
    lambda: |-
      // 逻辑画布尺寸（跟随 rotation 自动交换）：rotation 270 下为 800 x 480
      int w = it.get_width();
      int h = it.get_height();

      // ---- 四角标记：用来验证"触摸坐标 ↔ 显示坐标"是否对齐 ----
      // 绿=左上  红=右上  蓝=左下  白=右下
      it.filled_rectangle(0, 0, 40, 40, Color(0, 255, 0));
      it.filled_rectangle(w - 40, 0, 40, 40, Color(255, 0, 0));
      it.filled_rectangle(0, h - 40, 40, 40, Color(0, 0, 255));
      it.filled_rectangle(w - 40, h - 40, 40, 40, Color(255, 255, 255));

      // ---- 中心十字 + 外框：便于肉眼判断落点偏移 ----
      int cx = w / 2, cy = h / 2;
      it.line(cx - 60, cy, cx + 60, cy, Color(70, 70, 70));
      it.line(cx, cy - 60, cx, cy + 60, Color(70, 70, 70));
      it.rectangle(1, 1, w - 2, h - 2, Color(60, 60, 60));

      // ---- 触摸落点：黄实心圆 + 白圈 ----
      if (id(last_touch_x) >= 0 && id(last_touch_y) >= 0) {
        it.filled_circle(id(last_touch_x), id(last_touch_y), 14, Color(255, 220, 0));
        it.circle(id(last_touch_x), id(last_touch_y), 22, Color(255, 255, 255));
      }
    # ST7102 厂商初始化序列（还原自乐鑫官方 esp_lcd_st7102 组件）
    # DCS 封包格式：[cmd, 参数...]
    init_sequence:
      - [0x99, 0x71, 0x02, 0xA2]
      - [0x99, 0x71, 0x02, 0xA3]
      - [0x99, 0x71, 0x02, 0xA4]
      - [0xA4, 0x31]
      - [0xB0, 0x22, 0x57, 0x1E, 0x61, 0x2F, 0x57, 0x61]
      - [0xB7, 0x64, 0x64]
      - [0xBF, 0xB4, 0xB4]
      - [0xC8, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xC9, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xD7, 0x10, 0x0C, 0x36, 0x19, 0x90, 0x90]
      - [0xA3, 0x51, 0x03, 0x80, 0xCF, 0x44, 0x00, 0x00, 0x00, 0x00, 0x04, 0x78, 0x78, 0x00, 0x1A, 0x00, 0x45, 0x05, 0x00, 0x00, 0x00, 0x00, 0x46, 0x00, 0x00, 0x02, 0x20, 0x52, 0x00, 0x05, 0x00, 0x00, 0xFF]
      - [0xA6, 0x02, 0x00, 0x24, 0x55, 0x35, 0x00, 0x38, 0x00, 0x78, 0x78, 0x00, 0x24, 0x55, 0x36, 0x00, 0x37, 0x00, 0x78, 0x78, 0x02, 0xAC, 0x51, 0x3A, 0x00, 0x00, 0x00, 0x78, 0x78, 0x03, 0xAC, 0x21, 0x00, 0x04, 0x00, 0x00, 0x78, 0x78, 0x3E, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0xA7, 0x19, 0x19, 0x00, 0x64, 0x40, 0x07, 0x16, 0x40, 0x00, 0x04, 0x03, 0x78, 0x78, 0x00, 0x64, 0x40, 0x25, 0x34, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x64, 0x40, 0x4B, 0x5A, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x24, 0x40, 0x69, 0x78, 0x00, 0x00, 0x00, 0x00, 0x78, 0x78, 0x00, 0x44]
      - [0xAC, 0x08, 0x0A, 0x11, 0x00, 0x13, 0x03, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0x09, 0x0B, 0x10, 0x02, 0x12, 0x01, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0xFF, 0x67, 0xFF, 0x67, 0x00]
      - [0xAD, 0xCC, 0x40, 0x46, 0x11, 0x04, 0x78, 0x78]
      - [0xE8, 0x30, 0x07, 0x00, 0x94, 0x94, 0x9C, 0x00, 0xE2, 0x04, 0x00, 0x00, 0x00, 0x00, 0xEF]
      - [0xE7, 0x8B, 0x3C, 0x00, 0x0C, 0xF0, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0xFF, 0x00, 0x08, 0x7B, 0x00, 0x00, 0xC8, 0x6A, 0x5A, 0x08, 0x1A, 0x3C, 0x00, 0x81, 0x01, 0xCC, 0x01, 0x7F, 0xF0, 0x22]
      - [0x35, 0x00]    # TE on（乐鑫原始序列末尾同款）
    # ★ 不要在此序列里写 0x11(SLPOUT)/0x29(DISPON)/延时 —— 组件会自动追加
    #   delay0+SLPOUT+10ms+DISPON+10ms（含 120ms 复位等待）。
    #   自己再写一遍 = 面板收到两套 Sleep-Out/Display-On 流程 → 显示异常（实测踩坑）。

# ------------------------------------------------------------
# 触摸（M2 主体）
# ------------------------------------------------------------
touchscreen:
  - platform: st7123
    id: main_touch
    i2c_id: bus_a
    # 有中断引脚 → 走中断，不轮询（配了 interrupt_pin 后必须写 never，
    # 否则基类会打印 "Touch Polling Stopped" 警告）
    interrupt_pin: GPIO20
    reset_pin: GPIO13          # 原理图第 4 页标 GPIO14 是笔误，实为 GPIO13
    update_interval: never

    # ★ transform 推导（rotation 270 与触摸的对齐关系）
    #   显示侧映射（mipi_dsi.cpp draw_pixel_at, 270°）：
    #       物理 px = 逻辑 ly
    #       物理 py = 799 - 逻辑 lx
    #   反解：逻辑 lx = 799 - 物理 py，逻辑 ly = 物理 px
    #   触摸基类处理顺序（touchscreen.cpp add_raw_touch_position_）：
    #       ① 若 swap_x_y  → swap(raw_x, raw_y)
    #       ② normalize_ 用 calibration 的 min/max，并按 invert_x/invert_y 取反
    #       ③ 乘 display_width_/display_height_（= get_width()/get_height()，
    #          即旋转感知的逻辑尺寸 800 x 480）
    #   代入（设触摸 raw 与面板物理同向，即 raw_x≈px, raw_y≈py）：
    #       需要 tp.x ∝ (799 - py) → 必须 swap，且 x 取反
    #       需要 tp.y ∝ px        → y 不取反
    #   故：swap_xy=true, mirror_x=true, mirror_y=false
    #   （mirror_x → invert_x_，mirror_y → invert_y_）
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false

    # ★ 故意不写 calibration —— 组件会在首次触摸时调用 setup_lazy_()，
    #   用 REG_GET_MAX_COORD(0x0005) 从触摸芯片读回真实量程，比手写 480/800 更可靠
    #   （触摸 IC 的量程未必等于面板分辨率）。日志里会打印 "Max Coord: x y" 供确认。
    #   且组件在 swap_xy 时会把读回的 max 一并交换，与上面的处理顺序自洽。

    on_touch:
      - lambda: |-
          id(last_touch_x) = touch.x;
          id(last_touch_y) = touch.y;
          ESP_LOGI("m2", "TOUCH calc=(%d,%d) raw=(%d,%d)",
                   touch.x, touch.y, touch.x_raw, touch.y_raw);
    on_release:
      - lambda: |-
          ESP_LOGI("m2", "RELEASE");

# 背光（display 之后声明 → 屏幕 init 完成后才点亮）
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "屏幕背光"
    # ★ ALWAYS_ON：不依赖 NVS 恢复，每次启动/复位都强制点亮
    restore_mode: ALWAYS_ON

logger:
  level: DEBUG
