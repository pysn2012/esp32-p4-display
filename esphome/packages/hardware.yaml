# ------------------------------------------------------------
# 触摸（原生坐标恒等；旋转由 LVGL 统一处理——Tab5 同款配法）
# ------------------------------------------------------------
touchscreen:
  - platform: st7123
    id: main_touch
    i2c_id: bus_a
    interrupt_pin: GPIO20
    reset_pin: GPIO13
    update_interval: never
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
