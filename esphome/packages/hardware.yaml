# ============================================================
# hardware.yaml —— 芯片 / 总线 / C6 协处理器 / 显示 / 触摸 / 背光
# （对应 Tab5 的 packages/hardware.yaml；引脚均为 DFR1286 原理图核对值）
# ============================================================

# 芯片
esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true

# 片内 32MB hex PSRAM（LVGL 缓冲与 DSI 帧缓冲都靠它）
psram:
  mode: hex
  speed: 200MHz

# 片内 LDO 通道 3 输出 2.5V 供 MIPI DPHY
esp_ldo:
  - voltage: 2.5V
    channel: 3

# 自定义组件（路径相对 esphome/ 目录，与写在 ui.yaml 里等价）
external_components:
  - source:
      type: local
      path: components
    components: [mipi_dsi, st7123]

# 公共 I2C 总线（触摸 ST7123 0x55；音频 ES8388 0x11 本阶段不启用）
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

# ------------------------------------------------------------
# ESP32-C6 WiFi 协处理器（ESP-Hosted，原理图第 7 页）
#   C6 SDIO：CLK=GPIO18 CMD=GPIO19 D0~D3=GPIO14~17，C6_EN=GPIO5（R16 10K 上拉）
#   ★ M4R6 关键修复：slot 必须是 1！
#     ESP32-P4 的 SDMMC slot 0 是 IOMUX 硬连线（GPIO39~44，本板接 TF 卡座），
#     引脚不可重映射（esp-hosted Kconfig: range 43 43 / 44 44 / 39 39 ...）；
#     slot 1 走 GPIO 矩阵可任意映射，且 P4 默认值恰好就是 CLK18/CMD19/D0-D3=14~17。
#     之前 slot: 0 时 GPIO14~19 全部越界被 Kconfig 丢弃、回落到 TF 卡引脚 43/44/39~42，
#     C6 收不到任何 SDIO 命令 ⇒ CMD5 超时 0x107。
#     mpy 官方固件（ESP_HOSTED_P4_DEV_BOARD_FUNC_BOARD 预设）和 Tab5（slot 1）都证实此路径。
# ------------------------------------------------------------
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO5
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  slot: 1
  sdio_frequency: 10MHz

# ------------------------------------------------------------
# 背光（M1 定论：GPIO11，HIGH 亮）
# ★ gamma_correct: 0 ⇒ 滑块/状态里的百分比就是 PWM 占空比（缺省 2.8 会把 23% 抬到 ~60% 占空比）
# ------------------------------------------------------------
output:
  - platform: ledc
    pin:
      number: GPIO11
      inverted: false
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "屏幕背光"
    restore_mode: RESTORE_DEFAULT_ON
    gamma_correct: 0.0
    initial_state:
      brightness: 80%
    on_state:
      then:
        - if:
            condition:
              lambda: 'return id(lvgl_ready);'
            then:
              - script.execute: ui_sync_brightness

# ------------------------------------------------------------
# 显示（原生 480×800；rotation 归 LVGL；面板 10px 相位补偿在组件里）
# ------------------------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 480
      height: 800
    # ★ LVGL 模式：display 层不许配 rotation（lvgl 组件校验会拒）——270° 旋转在 lvgl.yaml 里
    color_order: RGB
    # ★ 界面整体偏移校准（M4R7 起两轴分开调）：
    #   · 逻辑垂直（列相位）：组件 x_shift（=10，M1 实测值；改它上下移动）
    #   · 逻辑水平（行相位）：vsync_back_porch —— 面板在 VSYNC 后固定 ~68 行才开采样窗，
    #     帧头内容行被吞 ⇒ 整体左移 68（M4R6 照片实测：右卡右边框 780→711、左卡标签被裁）。
    #     VBP 10→78 把内容整体推迟 68 行 = 右移 68px；VFP 同步 −68 保持总行数 962（刷新率不变）。
    #     ★ 校准只改一个数：仍偏左 N px → VBP 再 +N（VFP −N）；右移过头 → 反向减。
    #     （M1 "改 porch 无效" 仅对 hsync 成立：面板按 DSI 包界逐行取样，行内空白长度不影响起点）
    x_shift: 10
    lane_bit_rate: 500Mbps
    pclk_frequency: 36MHz
    hsync_back_porch: 40
    hsync_pulse_width: 2
    hsync_front_porch: 40
    vsync_back_porch: 78
    vsync_pulse_width: 2
    vsync_front_porch: 112
    reset_pin: GPIO21
    show_test_card: false
    auto_clear_enabled: false
    update_interval: never
    # ST7102 厂商初始化序列（与 full_test.yaml 完全一致；组件自动追加 0x11/0x29，勿手写）
    init_sequence:
      - [0x99, 0x71, 0x02, 0xA2]
      - [0x99, 0x71, 0x02, 0xA3]
      - [0x99, 0x71, 0x02, 0xA4]
      - [0xA4, 0x31]
      - [0xB0, 0x22, 0x57, 0x1E, 0x61, 0x2F, 0x57, 0x61]
      - [0xB7, 0x64, 0x64]
      - [0xBF, 0xB4, 0xB4]
      - [0xC8, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
