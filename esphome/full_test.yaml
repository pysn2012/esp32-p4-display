# ★ R5 做了什么 / 怎么判：
#     · 音频从"触摸→滴一声(1kHz/400ms)"改成 **每 800ms 自动播 400ms 的 2kHz 方波**：
#       不用再摸屏幕，随时可以拿万用表量；并顺带打了 `buf_before=` ，
#       它应当是 0（上一声已被抽干）。若长期为 1 ⇒ TX 根本没在消费数据（那就是另一个问题）。
#     · PA_EN 每 5s 翻一次、共 4 次，然后锁死 HIGH 常开：
#       测试音若跟着"有→无→有"地切 ⇒ 功放+喇叭+codec 整条通路都是通的。
#     · 触摸只留坐标日志（不再参与音频），少一个变量。
#     · ★ 显示（本轮的另外一半）：components/mipi_dsi/mipi_dsi.cpp 的相位补偿从
#       「行内取模」`x=(x−10+width_)%width_` 改成「**整帧线性取模**」`pos=(y*w+x−10)%(w*h)`。
#       为什么非改不可：行内取模只搬列、没搬行 ⇒ "每行最前 10 列"会跨行取到**上一行末尾**的内容，
#       而那 10 列在 rotation 270 下正是屏幕最顶上那条 10px ⇒ 现象 = "只有顶部 10px 整体偏左 1px"
#       （两轮实烧逐轮确认）。整帧取模把"跨行"也一起搬对，台阶消失。
#       ⇒ display lambda 里同步加了验收图案：顶部/中部各一块 2px 斑马块（错 1px 就黑白对调）
#         + 两根跨边界黄竖线（错 1px 就出折角）。
#     · 若这两种极性下**都听不到**，软件侧真的没有可查项了，请按"推送到GitHub清单.md"
#       R5 节的量测表在板上量三个点（codec 输出 / 功放输出 / 喇叭），能一步锁定断点。
# ============================================================
# ★★★ 2026-10-02 R6 —— 官方文档 + Tab5 参考逐项对比后的结论，以及本轮为什么这么改
# ------------------------------------------------------------
# ① 官方 es8388 文档（audio_dac/es8388）能配的只有 3 样：address（缺省 0x10，我们 0x11 ✔）、
#    i2c_id ✔、以及两个 select 实体（dac_output：LINE1/LINE2/BOTH；adc_input_mic）。
#    select 的 dac_output 本质就是 set_dac_output()（es8388.cpp:191-229 实核：写
#    0x2E~0x31 音量 + 0x04 DACPOWER），我们 on_boot 里已经调了 DAC_OUTPUT_BOTH，
#    是 LINE1 的超集 ⇒ **官方能做的我们都做了，且比缺省做得更全**。
# ② 本地 M5 Tab5 工程（ESP32-P4 + ES8388 + 同一组 26/27/28/29/30 引脚，能出声）对比：
#      Tab5:  i2s lrclk=GPIO29 bclk=GPIO27 mclk=GPIO30 / dout=26 / din=28   ← 与本板一致
#            es8388 不写 address（那块板 CE 接法对应 0x10）/ speaker 用 channel: mono + 48kHz
#      本板:  原理图第 6 页权威网络表 GPIO29=I2S_SCLK(BCLK)、GPIO27=I2S_LRCLK ⇒ 我们的
#            bclk=29 / lrclk=27 才是对的（两块板在这两点上恰好互换，别照抄 Tab5）
#    ⇒ 与已知能出声的 P4+ES8388 参考相比，我们**只差两处，且都有依据**：
#        · sample_rate 16000 vs 48000：codec 侧 0x18=0x02(256 倍比、single speed) 对
#          8k~48k 都成立，16k 的 MCLK=4.096MHz 也是标准值 ⇒ 不构成无声理由（不改，少动变量）。
#        · channel left vs mono：本板功放是差分输入（LOUT1−ROUT1），Tab5 是单端；
#          mono 会把同一采样喂进两个 slot ⇒ 差分输入恒 0 ⇒ **在咱这板上 mono 必哑**。
#          ESP-IDF 官方 TX 表已证明 mono+LEFT ⇒ 右 slot 输出 0（不是复制）⇒ left 是对的。
# ③ 顺带从源码实核掉一个嫌疑：microphone 与 speaker 共用一条 i2s_audio 总线**不是**问题 ——
#    麦克风的 RX 通道只在 start_driver_() 里创建（i2s_audio_microphone.cpp:98 try_lock），
#    没人消费麦克风它全程不动，不会改时钟/引脚。
# ④ ⇒ 软件侧彻底对齐已知良好参考之后仍然无声，断点只剩两种可能，本轮用软件一次分清：
#      A. codec 没在转换（I2S 时钟/电平进不去 codec）—— 但 ADC 与 DAC 共用同一套时钟，
#         所以 **让 codec 自己的 ADC 采一段声音**就能反证；
#      B. codec 活着，故障在 LOUT1/ROUT1 → PAM8302 → 喇叭 的模拟输出段。
#    → 新增 mic_probe 脚本（见 script 段）：停 speaker → 采 3 秒声 → 打印 min/max/块数。
#      · 块数>0 且跨度 >500  ⇒ A 排除，故障在模拟输出段 ⇒ 按量测表量 ①②（喇叭/功放SD）
#      · 块数>0 但全 0       ⇒ codec 没在转换 ⇒ 按量测表量 ③④ 与 LRCK 直流（判电平域）
#      · 块数=0              ⇒ 麦克风驱动没起来（看 ERROR 日志）
#    （这就是"不用万用表也能把断点定位到半条链路"的办法；量测表见 推送到GitHub清单.md）
# ============================================================
substitutions:
  name: p4-full-test
  # ★★ 测试编号（唯一权威来源）：CI 会 grep 这一行，写进产物名和固件文件名。
  #   格式必须严格是  test_round: "Rx"  —— 双引号不能省，
  #   否则 CI 取不到值，产物会被标成 R0-NOTAG（一眼就能看出"这份没编号"）。
  test_round: "R8"
  # 这一轮改了什么 —— 开机日志第二行会原样打出来，不用翻文件就知道烧的是哪一轮。
  test_round_desc: "ES8388 模拟旁路(sidetone)测试：LIN1/RIN1 经输出混音器直通 LOUT1/ROUT1，不经 I2S/ADC/DAC —— 一次烧录把『codec 模拟段+功放+喇叭』与『I2S 时钟/电平』彻底分开"

esphome:
  name: ${name}
  # ★★ 测试编号进固件元数据 —— 开机后 app 组件会自动打印：
  #   [I][app:153]: Project p4.full_test version R3
  #   （源码实核：core/application.cpp:153 ESP_LOGI(TAG, "Project " ... " version " ...)）
  #   项目名必须恰好含一个点（core/config.py:203 valid_project_name），故写 p4.full_test。
  project:
    name: "p4.full_test"
    version: "${test_round}"
  # ★ 两个 on_boot：600 打印横幅（越早越好），-100 做音频收尾（必须晚于所有 setup）。
  #   -100 = setup_priority::LATE，保证 ES8388 的 setup() 已经跑完。
  # ★ 不要在这里放长 delay —— on_boot 的 delay 会阻塞主循环，
  #   显示刷新（update_interval）是主循环驱动的，会图形消失（M1 踩坑）。
  #   下面的 lambda 全是非阻塞调用。
  on_boot:
    - priority: 600
      then:
        - logger.log:
            format: "===== BOOT CONFIG = M1+M2+M3 full_test  [${test_round}] ====="
            level: INFO
        # ★ 第二行：这一轮的编号 + 改动摘要。看日志就能确认烧的是哪一轮。
        - logger.log:
            format: "[${test_round}] ${test_round_desc}"
            level: INFO
    - priority: -100
      then:
        - lambda: |-
            // ★★ 2026-10-01：上游 es8388 组件的 setup() 从不调用 set_dac_output()，
            //   寄存器 0x04 (DACPOWER，线输出使能) 与 0x2E~0x31 (LOUT1/ROUT1/LOUT2/ROUT2
            //   输出音量，复位值 0x00 = 最小音量（不是 0dB）) 一直停在复位值 ⇒ 模拟信号出不到 PAM8302。
            //   唯一会写这两个的路径是 es8388 的 select 实体（我们没配），所以必须在这里补。
            //   DAC_OUTPUT_BOTH 一次把四路音量置 0x1E(0dB) 并把 DACPOWER 写成 0x3C。
            //   命名空间 esphome::es8388 与枚举值取自 components/es8388/es8388.h（已实核）。
            bool dac_ok = id(es8388_codec).set_dac_output(esphome::es8388::DAC_OUTPUT_BOTH);
            ESP_LOGI("m3", "ES8388 DAC output BOTH enable = %s", dac_ok ? "OK" : "FAIL");

            // ★★ speaker 配了 timeout: never ⇒ 任务起来后不会再因空闲自杀。
            //   这里只置一个 COMMAND_START 事件位（非阻塞），真正的启动在主循环的
            //   I2SAudioSpeakerBase::loop() 里。启动后它会一直写静音，state 恒为 RUNNING，
            //   于是触摸时 play() 不再走 vTaskDelay(200ms)、不会再返回 0 字节。
            id(spk_out).start();
            ESP_LOGI("m3", "speaker start requested");

            // ★★★ 2026-10-01 第三轮：关键寄存器回读。
            //   "I2C 写入返回 OK" ≠ "值真的落进芯片"。逐位核对 ES8388S 寄存器表后，
            //   下面这几条是本项目出声的必经之路，回读值必须与注释里的期望值一致。
            //   ★ 前三条是"整颗 codec 到底有没有在工作"的根基，任一不对 ⇒ 全静音：
            //     0x00 = 0x12  ChipControl1：VMIDSEL[1:0]=10(500kΩ)、SameFs=1
            //                  （与 ESP-ADF 逐字节同值；VMIDSEL=00 ⇒ 模拟基准分压器关闭）
            //     0x02 = 0x00  CHIPPOWER：0x00 = 全块正常上电
            //                  （setup 末尾写完 0xF0 又回写 0x00；若回读 0xF0 ⇒ 时钟被门控，静音）
            //     0x04 = 0x3C  线输出 + 左右 DAC 电源 (DAC_OUTPUT_BOTH)
            //     0x17 = 0x18  DACWL=011(16bit) + DACFORMAT=000(I2S)
            //     0x18 = 0x02  DACFsRatio=256（MCLK 4.096MHz ÷ 256 = 16kHz）
            //     0x19 = 0x20  bit2 DACMute = 0 ⇒ 未静音；bit5 DACSoftRamp = 1
            //     0x26 = 0x00  混音器输入选择 LMIXSEL/RMIXSEL
            //     0x27 = 0x90  bit7 LD2LO 使能，左 DAC → 左混音器 0dB
            //     0x2A = 0x90  同上，右声道
            //     0x2B = 0x80  slrck：ADC/DAC 共用 LRCK
            //     0x2E~0x31 = 0x1E  LOUT1/ROUT1/LOUT2/ROUT2 输出音量（0x00 = 最小，别留 0）
            //   ★ R5 补齐的 4 条（原先没回读，属于盲区）：
            //     0x01 = 0x50  ChipControl2（setup() 写死 0x50，与 ESP-ADF 同值）
            //     0x08 = 0x00  MASTERMODE：0x00 = codec 作 I2S 从机（主机是 P4）
            //     0x1A = 0x00 / 0x1B = 0x00  DAC 数字音量：0x00 = 0dB（最大值，不是静音）
            //        ★ 这两个是 set_volume() 写的，而 speaker 在它自己的 setup() 里
            //          就会调一次 set_volume(1.0) ⇒ 0x1A/0x1B 必为 0x00。
            //          若读出来不是 0x00，说明音量被压下去了（例如 0xC0 = -96dB ⇒ 哑）。
            const uint8_t chk[] = {0x00, 0x01, 0x02, 0x04, 0x08, 0x17, 0x18,
                                   0x19, 0x1A, 0x1B, 0x26, 0x27, 0x2A, 0x2B,
                                   0x2E, 0x2F, 0x30, 0x31};
            for (uint8_t r : chk) {
              uint8_t v = 0;
              bool ok = id(es8388_codec).read_byte(r, &v);
              if (ok)
                ESP_LOGI("m3", "ES8388 reg 0x%02X = 0x%02X", r, v);
              else
                ESP_LOGW("m3", "ES8388 reg 0x%02X READ FAIL", r);
            }

            // ★★★ R6 麦克笔回读探针（软件定位断点，不用万用表）：
            //   ES8388 的 ADC 与 DAC 共用同一套 MCLK/BCLK/LRCK。若 ADC 能采到真实声音，
            //   就证明「P4→codec 的时钟 + 电平 + codec 本体」全部活着，
            //   故障只剩 LOUT1/ROUT1 → PAM8302 → 喇叭 这段模拟通路；若采回全 0，
            //   问题在时钟/电平/codec，模拟输出段就不用查了。
            //   回调里只做 min/max 统计（跑在主循环，必须便宜）；开关与打日志交给 mic_probe。
            //   签名实核：microphone.h:23 template<typename F> void add_data_callback(F &&)。
            id(mic_in).add_data_callback([](const std::vector<uint8_t> &data) {
              if (!id(mic_probe_active))
                return;
              const int16_t *p = reinterpret_cast<const int16_t *>(data.data());
              const size_t n = data.size() / sizeof(int16_t);
              for (size_t i = 0; i < n; i++) {
                const int16_t v = p[i];
                if (v < id(mic_mn))
                  id(mic_mn) = v;
                if (v > id(mic_mx))
                  id(mic_mx) = v;
              }
              id(mic_n) += 1;
            });
            ESP_LOGI("m3", "MIC 回读探针已注册");
  # ★ 注意：set_audio_stream_info 只在 media_player 里被调用，普通 i2s_audio speaker 的
  #   stream info 用的是 speaker.h 里的编译期默认值 (16bit / 1ch / 16kHz) ——
  #   所以本文件所有 PCM 必须是「单声道 16bit 16kHz」，见下面 play_beep。

external_components:
  - source:
      type: local
      path: components
    components: [mipi_dsi, st7123]

esp32:
  variant: esp32p4
  flash_size: 16MB
  # 显式 360MHz：缺省取 400MHz 会报"实验性可能无法启动"警告
  cpu_frequency: 360MHz
  framework:
    type: esp-idf

# 片内 32MB hex PSRAM —— DSI 帧缓冲必须放这里
psram:
  mode: hex
  speed: 200MHz

# 片内 LDO 通道 3 输出 2.5V 供 MIPI DPHY
esp_ldo:
  - voltage: 2.5V
    channel: 3

# ------------------------------------------------------------
# 公共 I2C 总线（M2/M3 共用）
# 原理图 V0.0.2：SDA=GPIO7，SCL=GPIO8
# ★★ 2026-10-01 实烧 scan 实测在线器件（这份就是权威结论，别再按缺省值猜）：
#   0x11 = ES8388 音频编解码（★ 不是缺省 0x10！CE 脚接法决定 ⇒ 下方已显式写 address）
#   0x28 = 待查    0x55 = ST7123 触摸    0x69 = BMI323（SDO 拉高）
# ------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz
    scan: true

# ------------------------------------------------------------
# I2S 音频总线（M3 新增）
# ES8388 是 I2S 从机，P4 做 master 出全时钟：MCLK=256×fs=4.096MHz
# speaker(TX, GPIO26) 与 microphone(RX, GPIO28) 共用此总线，全双工
# ------------------------------------------------------------
i2s_audio:
  - id: audio_bus
    i2s_lrclk_pin: GPIO27
    i2s_bclk_pin: GPIO29
    i2s_mclk_pin: GPIO30

output:
  # 背光 PWM：GPIO11（M1 实测：HIGH → 亮，故不反相）
  - platform: ledc
    pin:
      number: GPIO11
      inverted: false
    id: backlight_pwm
    frequency: 1000Hz

switch:
  # 功放使能（PAM8302 的 SD 脚）。PAM8302 的 SD 是**高电平使能**。
  # ★ R5 起：本开关由上面 interval(5s) 自动扫 4 次（HIGH↔LOW）后锁死常开，
  #   restore_mode: ALWAYS_ON 只决定开机初始电平（HIGH）。
  # ★ 原理图实核（第 6 页）：SD ← GPIO31(PA_EN)，另挂 R48 10K；功放 VDD = ESP_3V3。
  #   ⇒ 若测试音跟着扫描"有→无→有"地切，功放+喇叭+codec 通路即全部正常。
  # ★ 若两种极性都听不到 ⇒ 软件侧已无可查项，按下面三点在板上量（详见 推送到GitHub清单.md R5 节）：
  #   1) 喇叭两端交流电压（最容易探的点，喇叭焊盘大）：放音时应 >0.2V AC；0 ⇒ 功放没在推
  #   2) U11 的 VO+/VO-(pin5/8) 对 GND 直流：应约 1.6V 且两脚接近（无信号时的中点）⇒ 功放有电且已使能
  #   3) U10 的 LOUT1(pin12) 或 C70 靠 codec 那侧焊盘对 AGND 直流：应约 1.6V（偏置）
  #      · 直流 0V/悬浮 ⇒ codec 模拟输出级没起来（供电/使能问题）
  #      · 直流 ≈1.6V 但放音时交流 ≈0 ⇒ **codec 没在做转换**（时钟/数据没到，查 MCLK=GPIO30）
  - platform: gpio
    pin: GPIO31
    id: pa_enable
    name: "功放使能"
    restore_mode: ALWAYS_ON

# 触摸落点缓存（display lambda 每帧读取画黄点；-1 = 未触摸）
globals:
  - id: last_touch_x
    type: int
    restore_value: no
    initial_value: '-1'
  - id: last_touch_y
    type: int
    restore_value: no
    initial_value: '-1'
  # R6 麦克风探针统计（on_boot 注册的回调写、mic_probe 读）
  - id: mic_mn
    type: int
    restore_value: no
    initial_value: '32767'
  - id: mic_mx
    type: int
    restore_value: no
    initial_value: '-32768'
  - id: mic_n
    type: int
    restore_value: no
    initial_value: '0'
  - id: mic_probe_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # R7 旋律播放标志（melody 置位期间压住常驻测试音，免得两股声音在环缓里互相插队）
  - id: melody_active
    type: bool
    restore_value: no
    initial_value: 'false'

# ------------------------------------------------------------
# M3 音频（官方 es8388 组件 + i2s_audio speaker）
# ★★ address 必须显式写 0x11 —— 实测 scan 只有 0x11 应答，组件缺省 0x10 会挂不上。
# 组件 setup() 实核覆盖：DAC 数字路径（DACCONTROL1/2/16/17/20/21/23）、
# ADC 录音路径（ALC 全套 + LIN1/RIN1）、解除 DAC 静音（DACCONTROL3 bit2）。
# ★★ 但它「不写」两处输出侧寄存器，必须我们自己补（见上面 on_boot 的 -100）：
#     0x04  DACPOWER —— 线输出使能（LOUT1/ROUT1/LOUT2/ROUT2）
#     0x2E~0x31      —— 输出音量，复位 0x00 = 最小音量（★ 不是 0dB）
#   （DACCONTROL4/5 数字音量确实是 0x00 = 0dB，别和上面那条混淆）
# ------------------------------------------------------------
audio_dac:
  - platform: es8388
    id: es8388_codec
    i2c_id: bus_a
    address: 0x11

speaker:
  - platform: i2s_audio
    id: spk_out
    i2s_audio_id: audio_bus
    dac_type: external          # 2026.x 起 internal DAC 已被上游移除，必须 external
    i2s_dout_pin: GPIO26
    sample_rate: 16000
    bits_per_sample: 16bit
    # ★★★ 2026-10-02 R4：channel 必须写 left —— 这是 R3 仍无声的根因。
    #   原理图实核（第 6 页 Audio codec）：
    #     ES8388 LOUT1(pin12) ──C70 1µF── R56 10K ──► U11 PAM8302A +IN(pin3)
    #     ES8388 ROUT1(pin11) ──C71 1µF── R57 10K ──► U11 PAM8302A −IN(pin4)
    #   两个输入都被驱动 ⇒ 功放放大的是 (LOUT1 − ROUT1)，是「差分输入」。
    #   而 slot_mask 决定单声道数据往哪几个 slot 送：
    #     channel: mono → slot_mask = I2S_STD_SLOT_BOTH ⇒ 同一个采样同时进左右两路
    #                     ⇒ LOUT1 与 ROUT1 波形完全相同 ⇒ (L−R)=0 ⇒ 功放输入恒 0 ⇒ 无声
    #     channel: left → slot_mask = I2S_STD_SLOT_LEFT ⇒ 只进左 slot、右 slot 为 0
    #                     ⇒ LOUT1 出信号、ROUT1 只维持直流偏置 ⇒ 差分输入拿到信号 ⇒ 出声
    #   源码实核：
    #     components/i2s_audio/__init__.py:189-196
    #       channel 非 stereo ⇒ slot_mode = MONO；slot_mask 仅 left/right 时不是 BOTH
    #     components/i2s_audio/speaker/i2s_audio_speaker_standard.cpp:437-478
    #       channels==1 只强制 slot_mode = MONO，**slot_mask 原样保留**，最后 slot_cfg.slot_mask = slot_mask
    #   ★ slot_mode 依旧是 MONO：speaker.h 的 audio_stream_info_ 是编译期默认 (16bit,1ch,16kHz)，
    #     唯一能改写它的 set_audio_stream_info() 只有 media_player 会调。
    #     所以 PCM 仍然是「单声道 16bit」不变，环缓仍是 16000B，别的都不用动。
    #     （证据：日志 "Created ring buffer with size 16000" = 500ms×16kHz×2B×1ch）
    channel: left
    # ★★ 关键修复：缺省 500ms 会在空闲 500ms 后把 speaker 任务杀掉并销毁 I2S 通道，
    #   于是每轮第一下 play() 返回 0 字节（而且 play() 内的 200ms vTaskDelay 会卡住主循环，
    #   状态机又跑在主循环里 ⇒ 越等越起不来）。never ⇒ 不调 set_timeout()，timeout_ 为空
    #   ⇒ 任务一旦启动就常驻（持续写静音），state 恒为 RUNNING，触摸时立即写入。
    timeout: never
    # 环形缓冲 = buffer_duration × sample_rate × 2B × 1ch = 500ms × 16000 × 2 = 16000 字节
    # "滴"声 = 400ms × 16000 × 2 = 12800 字节 ⇒ 一次 play 就装得下。
    buffer_duration: 500ms
    # 把 codec 挂上：speaker 的 set_volume / set_mute 会转到 ES8388
    # （音量 1.0 → DACCONTROL4/5 = 0x00 = 0dB，并在 setup 时解除静音）。
    audio_dac: es8388_codec

microphone:
  - platform: i2s_audio
    id: mic_in
    i2s_audio_id: audio_bus
    adc_type: external
    i2s_din_pin: GPIO28
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo              # ★ I2S 麦克风不支持 mono（上游 schema 明确禁止）
                                 # ★ R7：stereo 正好左右 slot 都收 —— 探针统计交织的 L+R 全部样本，
                                 #   配合差分输入（LIN1−RIN1）后两个 slot 都有信号，不漏任何一种可能
    # M3 只验证组件初始化；真正消费 mic 数据是 M4 语音助手的事

# ------------------------------------------------------------
# R5 测试音发生器：**2kHz 方波**、400ms、16kHz、**单声道** 16bit PCM，带 10ms 淡入淡出防爆音。
# ★★ 为什么是 2kHz（而不是原来的 1kHz）：
#   原理图实核 —— 板载喇叭 U12 与功放之间**串了一颗 C69 10µF**：
#       U11 VO+ ──C69 10µF── 喇叭 ── U11 VO-
#   它和喇叭阻抗构成高通 f_c = 1/(2π·R·C)：8Ω ⇒ ≈2.0kHz、4Ω ⇒ ≈4.0kHz。
#   ⇒ **1kHz 的测试音本来就会被削 7~12dB，≤500Hz 基本过不去**。测试音必须 ≥2kHz，
#     才能把"是不是被这颗电容吃掉了"这个干扰项彻底排除（方波能量最大，最不容易漏听）。
# ★★ 必须是单声道：speaker 内部的 stream info 是编译期默认的 1 声道（详见 speaker 段注释），
#    喂立体声会让它按 2 字节一帧去解析 4 字节的立体声数据 ⇒ 音调/时长全错。
# ★ 400ms 单声道 = 12800 字节 < 环缓 16000 字节，仍一次装得下（600ms 就超了，别加长）。
# ★ 注意：**不能**写 id(spk_out).play(pcm)（vector 版）—— 见下方 lambda 内的名字隐藏说明。
script:
  - id: test_tone
    then:
      - lambda: |-
          // ★ R6：麦克风探针占用 I2S 总线期间直接跳过 —— 否则这里见 state≠RUNNING 会调
          //   start() 把 speaker 又拉起来，重新抢走总线锁，探针就采不到数据了。
          // ★ R7：旋律播放期间也让路（旋律用同一个 speaker，混写会互相截断）。
          if (id(mic_probe_active) || id(melody_active))
            return;
          // R5：2kHz 方波。16kHz 采样 ⇒ 16000/(2000*2) = 每半周期 4 个采样。
          const int sr = 16000;
          const int nsamp = sr * 4 / 10;        // 400ms = 6400 采样
          const int ramp = sr / 100;            // 10ms 包络（防爆音）
          const int half = sr / 4000;           // 2kHz 半周期采样数 = 4
          std::vector<uint8_t> pcm;
          pcm.reserve(nsamp * 2);               // 单声道 16bit ⇒ 2 字节/采样 = 12800 字节
          for (int i = 0; i < nsamp; i++) {
            float env = 1.0f;
            if (i < ramp)
              env = (float) i / ramp;
            else if (i > nsamp - ramp)
              env = (float) (nsamp - i) / ramp;
            // 满幅方波 ±30000（≈ -0.8dBFS）：排查阶段宁大勿小
            int16_t v = ((i / half) & 1) ? (int16_t) (30000.0f * env) : (int16_t) (-30000.0f * env);
            pcm.push_back((uint8_t) (v & 0xFF));         // 小端：低字节
            pcm.push_back((uint8_t) ((v >> 8) & 0xFF));  // 小端：高字节
          }
          // ---- 播放 ----
          // ★ 必须用「指针 + 长度」版，不能写 play(pcm)（vector 版）。
          //   根因 = C++ 名字隐藏：i2s_audio_speaker.h 的具体类 I2SAudioSpeakerBase 自己声明了
          //       play(const uint8_t*, size_t, TickType_t)   ← 第 75 行
          //       play(const uint8_t*, size_t)               ← 第 76 行
          //   且没有 `using Speaker::play;` ⇒ 基类 speaker.h:50 的
          //       play(const std::vector<uint8_t> &) 被隐藏，调不到（已编译踩坑）。
          //   签名直接取自编译器报错的候选列表。
          // ★ 非阻塞铁律：本 lambda 跑在主循环任务里，而 speaker 的状态机在
          //   I2SAudioSpeakerBase::loop() 里 —— 同一个任务。所以这里**绝不能等它**：
          //   play() 一旦发现 state != RUNNING 就会 vTaskDelay(ticks)，把状态机一起冻住，
          //   等多久都还是 0 字节（上一轮 BEEP written 0/19200 的真凶，顺带把 touchscreen
          //   卡了 230~460ms）。所以：先无阻塞 start()，再以极小 ticks 尝试写。
          //   timeout: never 已保证 speaker 常驻 RUNNING，正常情况下一次就写完 12800 字节。
          // ★ 内部行为（i2s_audio_speaker.cpp 实核）：走
          //   write_without_replacement(..., write_partial=true) ⇒ 允许部分写入 ⇒ 需要补齐循环。
          // ★ R5：先看一眼"上一声有没有被抽干"，再写新的一声。
          //   buf_before 正常应当一直是 0（上一声 400ms 的数据早就被 DMA 取走了）。
          //   若它长期为 1 ⇒ 环形缓冲根本没人消费 ⇒ TX 通道没在跑（那才是真正的数字侧故障）。
          bool buf_before = id(spk_out).has_buffered_data();
          if (!id(spk_out).is_running())
            id(spk_out).start();          // 只置 COMMAND_START 事件位，非阻塞
          size_t sent = 0;
          int guard = 0;
          while (sent < pcm.size() && guard++ < 8) {
            size_t n = id(spk_out).play(pcm.data() + sent, pcm.size() - sent, pdMS_TO_TICKS(2));
            if (n == 0)
              break;   // 环形缓冲暂时塞不进 → 放弃本次（下一轮 800ms 后会补上）
            sent += n;
          }
          static uint32_t tone_n = 0;
          tone_n++;
          if ((tone_n % 4) == 1)   // 每 4 声打一行，不刷屏
            ESP_LOGI("m3", "TONE #%u %u/%u bytes running=%d buf_before=%d",
                     (unsigned) tone_n, (unsigned) sent, (unsigned) pcm.size(),
                     (int) id(spk_out).is_running(), (int) buf_before);

# ------------------------------------------------------------
# R6 麦克笔回读探针 —— 不用万用表，把断点定位到「codec 之前」还是「codec 之后」
# 原理：ES8388 的 ADC 与 DAC 共用同一套 MCLK/BCLK/LRCK（0x2B=0x80 显式共用 LRCK）。
#   · ADC 采到真实声音 ⇒ 时钟/电平/codec 全活 ⇒ 故障在 LOUT1/ROUT1 → PAM8302 → 喇叭
#   · ADC 采回来全 0   ⇒ codec 没在转换 ⇒ 查时钟/电平（量测表 ③④ 与 LRCK 直流分量）
# 为什么先停 speaker：speaker 配了 timeout: never，RUNNING 期间一直持有父总线锁，
#   unlock 只出现在停止/出错路径（i2s_audio_speaker.cpp:273/282/305/327）；
#   麦克风的 start_driver_() 要 try_lock（i2s_audio_microphone.cpp:98）⇒ 不停就永远拿不到。
# 顺带关掉 ADC 的 noise gate：组件 setup() 把 0x16(ADCCONTROL14) 写成 0xC3
#   （NGTH=-40.5dB + NGG=静音 ADC）⇒ 安静环境下 ADC 会被强制输出 0，探针会误判成"没在转换"。
# 判读见脚本末尾三条 ESP_LOGE。（★ 与 test_tone 同属一个 script: 列表，不新开键）
  - id: mic_probe
    mode: single
    then:
      - lambda: |-
          id(mic_probe_active) = true;
          ESP_LOGI("m3", "MIC 探针① 停 speaker、释放 I2S 总线锁（约 6 秒后恢复）");
          id(spk_out).stop();
      - delay: 2s
      - lambda: |-
          id(mic_mn) = 32767;
          id(mic_mx) = -32768;
          id(mic_n) = 0;
          // ★★★ R7：补写 ADC 侧四个从未被正确配置的寄存器（原理图网表 + datasheet 实证）：
          //   板上麦是伪差分接法（信号→LINx、GND 基准→RINx），而组件 setup()：
          //   从不写 0x0A/0x0B（输入选择）、把 0x0C 写成 left-justified(0x0D)、增益 0x09=0dB。
          id(es8388_codec).write_byte(0x09, 0x88);   // ADCCONTROL1：MicAmpL/R 都 +24dB（原 0dB）
          id(es8388_codec).write_byte(0x0A, 0xF0);   // ADCCONTROL2：LINSEL=RINSEL=11 → L-R 差分
          id(es8388_codec).write_byte(0x0B, 0x00);   // ADCCONTROL3：DS=0 ⇒ LIN1−RIN1（麦1）；清掉 0x02
          id(es8388_codec).write_byte(0x0C, 0x0C);   // ADCCONTROL4：ADCFORMAT=I2S(组件写的 0x0D 是
                                                     //   left-justified，与 I2S RX 时序不匹配) + 16bit
          id(es8388_codec).write_byte(0x16, 0x00);   // ADCCONTROL14：关 noise gate（同 R6）
          // 回读这 5 条，确认真落进芯片
          const uint8_t chk[] = {0x09, 0x0A, 0x0B, 0x0C, 0x16};
          for (uint8_t r : chk) {
            uint8_t v = 0;
            if (id(es8388_codec).read_byte(r, &v))
              ESP_LOGI("m3", "ADC 补写回读 0x%02X = 0x%02X", r, v);
            else
              ESP_LOGW("m3", "ADC 补写回读 0x%02X FAIL", r);
          }
          id(mic_in).start();                         // 非阻塞，驱动在主循环里真正起来
          ESP_LOGI("m3", "MIC 探针② 采集 3 秒 —— 对着板上麦克风出声 / 拍手");
      - delay: 3s
      - lambda: |-
          id(mic_in).stop();
          const bool got = id(mic_n) > 0;
          const int span = id(mic_mx) - id(mic_mn);
          ESP_LOGI("m3", "MIC 回读：块数=%d min=%d max=%d 跨度=%d",
                   id(mic_n), id(mic_mn), id(mic_mx), span);
          if (!got)
            ESP_LOGE("m3", "★ 判定：一个数据块都没收到 ⇒ 麦克风驱动没起来（往上翻 ERROR）");
          else if (span > 500)
            ESP_LOGE("m3", "★ 判定：ADC 采到真实声音 ⇒ 时钟/电平/codec 全部正常 ⇒ 故障在 LOUT1/ROUT1→功放→喇叭（模拟输出段），量测表量 ①②");
          else
            ESP_LOGE("m3", "★ 判定：有数据块但全是 0 ⇒ codec 没在转换（时钟/电平），量测表量 ③④ 与 LRCK 直流分量");
      - delay: 500ms
      - lambda: |-
          id(spk_out).start();
          id(mic_probe_active) = false;
          ESP_LOGI("m3", "MIC 探针③ speaker 已恢复，测试音继续");

  # ------------------------------------------------------------
  # R7 试听旋律：三音上行 2667 → 2000 → 4000 Hz，各 300ms，每 10s 一段。
  #   · 频率全部 ≥2kHz —— 避开喇叭回路 C69 10µF 的高通（8Ω ≈ 2.0kHz）
  #   · 与常驻 2kHz 测试音音高不同，出声即能分辨；melody_active 压住 test_tone 防混写
  #   · 写法与 test_tone 完全同款（play 指针版 + 补齐循环，非阻塞铁律）
  #   （★ 与 test_tone/mic_probe 同属一个 script: 列表，不新开键）
  - id: melody
    mode: single
    then:
      - lambda: |-
          if (id(mic_probe_active))
            return;                      // 探针采音期间不来凑热闹
          id(melody_active) = true;
      - delay: 100ms
      - lambda: |-
          { // 音1：2667Hz（half=16000/5334=3）
            const int sr = 16000, half = 3, nsamp = sr * 3 / 10, ramp = sr / 100;
            std::vector<uint8_t> pcm; pcm.reserve(nsamp * 2);
            for (int i = 0; i < nsamp; i++) {
              float env = 1.0f;
              if (i < ramp) env = (float) i / ramp;
              else if (i > nsamp - ramp) env = (float) (nsamp - i) / ramp;
              int16_t v = ((i / half) & 1) ? (int16_t) (28000.0f * env) : (int16_t) (-28000.0f * env);
              pcm.push_back((uint8_t) (v & 0xFF));
              pcm.push_back((uint8_t) ((v >> 8) & 0xFF));
            }
            if (!id(spk_out).is_running()) id(spk_out).start();
            size_t sent = 0; int guard = 0;
            while (sent < pcm.size() && guard++ < 10) {
              size_t n = id(spk_out).play(pcm.data() + sent, pcm.size() - sent, pdMS_TO_TICKS(2));
              if (n == 0) break;
              sent += n;
            }
            ESP_LOGI("m3", "MELODY 音1 2667Hz %u/%u bytes", (unsigned) sent, (unsigned) pcm.size());
          }
      - delay: 450ms
      - lambda: |-
          { // 音2：2000Hz（half=4）
            const int sr = 16000, half = 4, nsamp = sr * 3 / 10, ramp = sr / 100;
            std::vector<uint8_t> pcm; pcm.reserve(nsamp * 2);
            for (int i = 0; i < nsamp; i++) {
              float env = 1.0f;
              if (i < ramp) env = (float) i / ramp;
              else if (i > nsamp - ramp) env = (float) (nsamp - i) / ramp;
              int16_t v = ((i / half) & 1) ? (int16_t) (28000.0f * env) : (int16_t) (-28000.0f * env);
              pcm.push_back((uint8_t) (v & 0xFF));
              pcm.push_back((uint8_t) ((v >> 8) & 0xFF));
            }
            if (!id(spk_out).is_running()) id(spk_out).start();
            size_t sent = 0; int guard = 0;
            while (sent < pcm.size() && guard++ < 10) {
              size_t n = id(spk_out).play(pcm.data() + sent, pcm.size() - sent, pdMS_TO_TICKS(2));
              if (n == 0) break;
              sent += n;
            }
            ESP_LOGI("m3", "MELODY 音2 2000Hz %u/%u bytes", (unsigned) sent, (unsigned) pcm.size());
          }
      - delay: 450ms
      - lambda: |-
          { // 音3：4000Hz（half=2）
            const int sr = 16000, half = 2, nsamp = sr * 3 / 10, ramp = sr / 100;
            std::vector<uint8_t> pcm; pcm.reserve(nsamp * 2);
            for (int i = 0; i < nsamp; i++) {
              float env = 1.0f;
              if (i < ramp) env = (float) i / ramp;
              else if (i > nsamp - ramp) env = (float) (nsamp - i) / ramp;
              int16_t v = ((i / half) & 1) ? (int16_t) (28000.0f * env) : (int16_t) (-28000.0f * env);
              pcm.push_back((uint8_t) (v & 0xFF));
              pcm.push_back((uint8_t) ((v >> 8) & 0xFF));
            }
            if (!id(spk_out).is_running()) id(spk_out).start();
            size_t sent = 0; int guard = 0;
            while (sent < pcm.size() && guard++ < 10) {
              size_t n = id(spk_out).play(pcm.data() + sent, pcm.size() - sent, pdMS_TO_TICKS(2));
              if (n == 0) break;
              sent += n;
            }
            ESP_LOGI("m3", "MELODY 音3 4000Hz %u/%u bytes", (unsigned) sent, (unsigned) pcm.size());
          }
      - delay: 450ms
      - lambda: |-
          id(melody_active) = false;

  # ------------------------------------------------------------
  # ★★★ R8：ES8388 官方「模拟旁路」测试（datasheet rev5.0 §6.3.16~6.3.20 + §9.1）
  # 原理：ES8388 的输出混音器可以把**模拟输入**直接混进输出驱动——
  #       LMIXSEL(0x26 bit5:3)=000 选 LIN1、RMIXSEL(bit2:0)=000 选 RIN1；
  #       LI2LO(0x27 bit6)=1 把 LIN 混进左混音器、RI2RO(0x2A bit6)=1 把 RIN 混进右混音器；
  #       混音增益 LI2LOVOL/RI2ROVOL(bit5:3)：000=+6dB。
  #       datasheet §9.1 原话：mixers/output drivers "can be separately enabled ...
  #       irrespective of whether the DACs are running or not" —— **不需要任何 I2S 时钟**。
  # 链路：麦1 LIN1(信号) ─ 混音器(+24dB PGA +6dB) → LOUT1；RIN1(基准) → ROUT1
  #       → C70/C71 → PAM8302A 差分(L−R) → 喇叭。**完全绕开 I2S/ADC/DAC/时钟。**
  # 判读：窗内拍手听到回放/啸叫 ⇒ codec 模拟段+功放+喇叭+麦克风全活
  #       ⇒ 断点唯一化 = I2S 接口（时钟/电平/走线，即电源域假设）；
  #       死寂 ⇒ codec 模拟段或功放/喇叭故障（转量 C70/C71→PAM→喇叭段）。
  # 与 mic_probe 无寄存器冲突（探针写 0x09/0x0A/0x0B/0x0C/0x16，本脚本写 0x26/0x27/0x2A，
  #   0x09/0x16 两边值相同），重叠窗口互不破坏。
  # ------------------------------------------------------------
  - id: sidetone
    mode: single
    then:
      - lambda: |-
          // 确保 PA 使能（R5 后已锁 HIGH，此处幂等兜底）
          id(pa_enable).turn_on();
          // 麦前放 +24dB（0x09 = ADCCONTROL1 MicAmpL/R），关噪声门
          id(es8388_codec).write_byte(0x09, 0x88);
          id(es8388_codec).write_byte(0x16, 0x00);
          // LMIXSEL=LIN1(000) / RMIXSEL=RIN1(000)（与复位缺省一致，显式写防意外）
          id(es8388_codec).write_byte(0x26, 0x00);
          // 左混音器：LD2LO=1(bit7，保持 DAC 支路) + LI2LO=1(bit6) + 增益+6dB(bit5:3=000)
          id(es8388_codec).write_byte(0x27, 0xC0);
          // 右混音器：RD2RO=1 + RI2RO=1 + 增益+6dB
          id(es8388_codec).write_byte(0x2A, 0xC0);
          uint8_t v27 = 0, v2a = 0, v26 = 0;
          id(es8388_codec).read_byte(0x27, &v27);
          id(es8388_codec).read_byte(0x2A, &v2a);
          id(es8388_codec).read_byte(0x26, &v26);
          ESP_LOGI("m3", "SIDETONE ON —— 请拍手/出声！回读 0x26=0x%02X(期0x00) 0x27=0x%02X(期0xC0) 0x2A=0x%02X(期0xC0)",
                   v26, v27, v2a);
      - delay: 8s
      - lambda: |-
          // 恢复 setup() 的值（LD2LO/RD2RO=1、LI2LO/RI2RO=0、增益位=000）
          id(es8388_codec).write_byte(0x27, 0x90);
          id(es8388_codec).write_byte(0x2A, 0x90);
          ESP_LOGI("m3", "SIDETONE OFF（混音器已恢复 0x90，等下一个 30s 窗口）");

# ------------------------------------------------------------
# R5 自动播测试音 + PA 极性扫描
# ★ 为什么改成自动播：不用再摸屏幕（触摸只留坐标日志），随时可以拿表量、拿耳朵听。
# ★ PA 扫描：每 5s 翻一次、共 4 次，之后锁死 HIGH 常开 ——
#   测试音若跟着"有 → 无 → 有"地切，就说明功放 + 喇叭 + codec 整条通路都是通的。
# ------------------------------------------------------------
interval:
  - interval: 800ms
    then:
      - script.execute: test_tone
  - interval: 5s
    then:
      - lambda: |-
          static uint8_t n = 0;
          n++;
          if (n <= 4) {
            bool on = ((n % 2) == 0);     // 开机是 ALWAYS_ON ⇒ 先让它 5s 后变 LOW，做第一次对比
            if (on)
              id(pa_enable).turn_on();
            else
              id(pa_enable).turn_off();
            ESP_LOGI("diag", "PA 扫描 %u/4 -> %s", (unsigned) n, on ? "HIGH = 使能" : "LOW = 关闭");
          } else if (n == 5) {
            id(pa_enable).turn_on();
            ESP_LOGI("diag", "PA 锁定 HIGH 常开，后面不再动");
          }
  # ★ R6：每 25s 做一次麦克笔回读探针（约 6s，期间测试音暂停）。
  #   探针会先把 PA 扫描那 25s 避开：开机 25s 时 PA 已锁 HIGH，互不干扰。
  - interval: 25s
    then:
      - script.execute: mic_probe
  # ★ R8：每 30s 开一扇 8s 的「旁路听窗」—— 窗内拍手，听喇叭有没有回放/啸叫。
  #   （R7 的 melody 10s 轮已停用：旋律走 I2S，已被证明无声，只会干扰旁路听窗。）
  - interval: 30s
    then:
      - script.execute: sidetone

display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    dimensions:
      width: 480
      height: 800
    # ★ M1 定论：rotation 270（顺时针 90°），走 C++ 软件路径。
    #   DSI 模型被强制移除 swap_xy → 90/270 只能软件旋转；180 才走硬件。
    rotation: 270
    lanes: 2
    # ★ M1 定论：必须显式写 RGB（CUSTOM 默认 BGR → 红蓝对调）
    color_order: RGB
    # 500Mbps / 36MHz / 时序均为 screen.py 板级实测值
    lane_bit_rate: 500Mbps
    pclk_frequency: 36MHz
    # ★★ 2026-10-01：改 porch 无效（实测无变化），恢复厂商值。
    #   列方向 ~10px 的刚性平移改由 components/mipi_dsi/mipi_dsi.cpp 的 X_SHIFT=10 软件对齐。
    # ★★★ 2026-10-02 R5 修正：补偿必须按「整帧线性取模」pos=(y*480+x−10)%384000，
    #   **不能**按「行内取模」。实测：行内取模会让"每行最前 10 列"跨行取到上一行末尾的内容，
    #   而那 10 列在 rotation 270 下正是屏幕最顶上那条 10px ⇒ 表现为"只有顶部 10px 整体偏左 1px"。
    #   例外（本补偿不覆盖）：fill()（std::fill_n 整屏同色）与 draw_pixels_at()（贴图，M4 另补）。
    #   完整推导见 components/mipi_dsi/mipi_dsi.cpp 内 draw_pixel_at 上方注释。
    hsync_back_porch: 40
    hsync_pulse_width: 2
    hsync_front_porch: 40
    vsync_back_porch: 10
    vsync_pulse_width: 2
    vsync_front_porch: 180
    reset_pin: GPIO21
    # 复位 settle 已在 components/mipi_dsi/mipi_dsi.cpp 补丁：
    # 低脉冲 20ms + 释放后 delay(120)，解决"按 RESET 无图"
    show_test_card: false
    auto_clear_enabled: true
    update_interval: 100ms
    lambda: |-
      // 逻辑画布（旋转感知）：rotation 270 下为 800 x 480
      int w = it.get_width();
      int h = it.get_height();

      // 四角标记：验证触摸↔显示坐标对齐
      // 绿=左上  红=右上  蓝=左下  白=右下
      it.filled_rectangle(0, 0, 40, 40, Color(0, 255, 0));
      it.filled_rectangle(w - 40, 0, 40, 40, Color(255, 0, 0));
      it.filled_rectangle(0, h - 40, 40, 40, Color(0, 0, 255));
      it.filled_rectangle(w - 40, h - 40, 40, 40, Color(255, 255, 255));

      // 中心十字 + 外框
      int cx = w / 2, cy = h / 2;
      it.line(cx - 60, cy, cx + 60, cy, Color(70, 70, 70));
      it.line(cx, cy - 60, cx, cy + 60, Color(70, 70, 70));
      it.rectangle(1, 1, w - 2, h - 2, Color(60, 60, 60));

      // ------------------------------------------------
      // ★★★ R5 显示验收图案：专盯"最顶上那条 10px 有没有水平错 1px"
      //   背景：这条 10px 就是 X_SHIFT 补偿里"每行最前 10 列跨行取数"的那一段。
      //   ① 相位检器 —— 2px 竖条纹（黑/白交替）。
      //      只要水平方向错 1px，黑白相位就**整体对调**。2px 的周期 = 最灵敏的游标尺。
      //      块 A 的 ly 从 0 开始（必须跨过那条边界 ly=10）；
      //      块 B 放在屏幕中部（完全在正常区域），作为"正确长相"的参照物。
      //      判据：块 A 上下一整条必须连续；一旦在 ly=10 附近出现"黑白突然对调"的横向分界
      //            ⇒ 补偿还没到位，1px 台阶仍在。
      //   ② 台阶检器 —— 两根 1px 细竖线，从 ly=0 一路拉到 ly=180（跨过边界）。
      //      直线的边缘连续性人眼极其敏感，任何 1px 水平错位都会在 ly=10 处露出一个折角。
      //      这两条线同时也是"最直接"的证据：一眼看它直不直。
      //   ★ 两者都只经 draw_pixel_at ⇒ 会走 X_SHIFT 补偿，正是我们要验的那条路径。
      //     （fill() 不走补偿，所以清屏不能用来验证。）
      for (int i = 0; i < 100; i++) {
        Color sc = (i & 1) ? Color(255, 255, 255) : Color(0, 0, 0);
        it.filled_rectangle(100 + i * 2, 0, 2, 40, sc);      // 块 A：跨边界 ly=0..39
        it.filled_rectangle(100 + i * 2, 200, 2, 40, sc);    // 块 B：对照 ly=200..239
      }
      it.vertical_line(420, 0, 180, Color(255, 255, 0));
      it.vertical_line(424, 0, 180, Color(255, 255, 0));

      // 触摸落点：黄实心圆 + 白圈
      if (id(last_touch_x) >= 0 && id(last_touch_y) >= 0) {
        it.filled_circle(id(last_touch_x), id(last_touch_y), 14, Color(255, 220, 0));
        it.circle(id(last_touch_x), id(last_touch_y), 22, Color(255, 255, 255));
      }
    # ST7102 厂商初始化序列（还原自乐鑫官方 esp_lcd_st7102 组件）
    init_sequence:
      - [0x99, 0x71, 0x02, 0xA2]
      - [0x99, 0x71, 0x02, 0xA3]
      - [0x99, 0x71, 0x02, 0xA4]
      - [0xA4, 0x31]
      - [0xB0, 0x22, 0x57, 0x1E, 0x61, 0x2F, 0x57, 0x61]
      - [0xB7, 0x64, 0x64]
      - [0xBF, 0xB4, 0xB4]
      - [0xC8, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xC9, 0x00, 0x00, 0x0F, 0x1C, 0x34, 0x00, 0x60, 0x03, 0xA0, 0x06, 0x10, 0xFE, 0x06, 0x74, 0x03, 0x21, 0xC4, 0x00, 0x08, 0x00, 0x22, 0x46, 0x0F, 0x8F, 0x0A, 0x32, 0xF2, 0x0C, 0x42, 0x0C, 0xF3, 0x80, 0x00, 0xAB, 0xC0, 0x03, 0xC4]
      - [0xD7, 0x10, 0x0C, 0x36, 0x19, 0x90, 0x90]
      - [0xA3, 0x51, 0x03, 0x80, 0xCF, 0x44, 0x00, 0x00, 0x00, 0x00, 0x04, 0x78, 0x78, 0x00, 0x1A, 0x00, 0x45, 0x05, 0x00, 0x00, 0x00, 0x00, 0x46, 0x00, 0x00, 0x02, 0x20, 0x52, 0x00, 0x05, 0x00, 0x00, 0xFF]
      - [0xA6, 0x02, 0x00, 0x24, 0x55, 0x35, 0x00, 0x38, 0x00, 0x78, 0x78, 0x00, 0x24, 0x55, 0x36, 0x00, 0x37, 0x00, 0x78, 0x78, 0x02, 0xAC, 0x51, 0x3A, 0x00, 0x00, 0x00, 0x78, 0x78, 0x03, 0xAC, 0x21, 0x00, 0x04, 0x00, 0x00, 0x78, 0x78, 0x3E, 0x00, 0x06, 0x00, 0x00, 0x00, 0x00]
      - [0xA7, 0x19, 0x19, 0x00, 0x64, 0x40, 0x07, 0x16, 0x40, 0x00, 0x04, 0x03, 0x78, 0x78, 0x00, 0x64, 0x40, 0x25, 0x34, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x64, 0x40, 0x4B, 0x5A, 0x00, 0x00, 0x02, 0x01, 0x78, 0x78, 0x00, 0x24, 0x40, 0x69, 0x78, 0x00, 0x00, 0x00, 0x00, 0x78, 0x78, 0x00, 0x44]
      - [0xAC, 0x08, 0x0A, 0x11, 0x00, 0x13, 0x03, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0x09, 0x0B, 0x10, 0x02, 0x12, 0x01, 0x1B, 0x18, 0x06, 0x1A, 0x19, 0x1B, 0x1B, 0x1B, 0x18, 0x1B, 0xFF, 0x67, 0xFF, 0x67, 0x00]
      - [0xAD, 0xCC, 0x40, 0x46, 0x11, 0x04, 0x78, 0x78]
      - [0xE8, 0x30, 0x07, 0x00, 0x94, 0x94, 0x9C, 0x00, 0xE2, 0x04, 0x00, 0x00, 0x00, 0x00, 0xEF]
      - [0xE7, 0x8B, 0x3C, 0x00, 0x0C, 0xF0, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0x5D, 0x00, 0xFF, 0x00, 0x08, 0x7B, 0x00, 0x00, 0xC8, 0x6A, 0x5A, 0x08, 0x1A, 0x3C, 0x00, 0x81, 0x01, 0xCC, 0x01, 0x7F, 0xF0, 0x22]
      - [0x35, 0x00]    # TE on（乐鑫原始序列末尾同款）
    # ★ 不要写 0x11/0x29/延时 —— 组件自动追加，写两套会导致显示异常（踩坑）

# ------------------------------------------------------------
# 触摸（★ M2 已于 2026-10-01 实烧验证通过 → transform 三参数是定论，别再改）
# transform 推导：显示 270° 映射 px=ly, py=799-lx → 需 swap+X取反
# calibration 不写 —— 组件首次触摸时从芯片 REG_GET_MAX_COORD 自动读量程（实测 480 800）
# ------------------------------------------------------------
touchscreen:
  - platform: st7123
    id: main_touch
    i2c_id: bus_a
    interrupt_pin: GPIO20
    reset_pin: GPIO13
    update_interval: never     # 配了中断就不轮询
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      # ★ R5：触摸只更新黄点 + 记坐标。音频改由上面的 interval 自动循环播，
      #   PA 极性也改由 interval 自动扫 ⇒ 触摸不再参与音频，变量更少、日志更干净。
      - lambda: |-
          id(last_touch_x) = touch.x;
          id(last_touch_y) = touch.y;
          ESP_LOGI("m2", "TOUCH calc=(%d,%d) raw=(%d,%d)",
                   touch.x, touch.y, touch.x_raw, touch.y_raw);
    on_release:
      - lambda: |-
          ESP_LOGI("m2", "RELEASE");

# 背光（display 之后声明 → 屏幕 init 完成后才点亮）
light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "屏幕背光"
    restore_mode: ALWAYS_ON

logger:
  level: DEBUG
