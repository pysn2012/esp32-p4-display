# ============================================================
# ESP32-P4 开发板 M1+M2+M3 —— 全功能验证（一烧全测）
# ============================================================
# 目标   : 一次烧录验证三件事：
#            M1 显示：屏幕出图（四角标记+中心十字+外框）
#            M2 触摸：手指点哪，黄点落在哪（ST7123, I2C 0x55）
#            M3 音频：每次触摸播一声"滴"（ES8388 + PAM8302 功放）
# 前置   : M1/M2 已通过。本文件 = touch_test.yaml + 音频，显示/触摸参数
#          与已验证版本完全一致，未做任何改动。
# 编译   : 单文件，无 secrets 依赖。CI 里选择 full_test.yaml
# ★ 必读 : external_components 引入两个本地组件（推仓库时
#          esphome/components/ 整个目录都要提交）：
#            - mipi_dsi : 打过补丁（P4 rev3.0+ DPHY PLL 时钟源 abort）
#            - st7123   : 触摸驱动，非上游组件，来自 M5 Tab5 工程
# 硬件   : I2C  SDA=GPIO7  SCL=GPIO8 —— 触摸 0x55 / ES8388 0x11 共用
#          触摸  TP_INT=GPIO20  TP_RST=GPIO13
#          音频  I2S: MCLK=30 BCLK=29 LRCK=27 DOUT(播)=26 DIN(录)=28
#                功放使能 PA_EN=GPIO31（PAM8302，厂商配置为高有效常开）
# 通过   : ① 屏幕出现四角色块+十字 ② 黄点跟手 ③ 开机后**能持续听到 2kHz 断续测试音**
#          ★ R5 新增显示判据（看，不用量）：
#            · 顶部那块"黑/白 2px 竖条纹"（ly 0~39）必须与中部那块（ly 200~239）**长得一模一样**；
#              若顶部那 10px 黑白整体对调 ⇒ 还有 1px 台阶（补偿没修好）。
#            · 两根黄色 1px 竖线（lx=420/424，ly 0~180）必须**笔直**，不能在顶部露出折角。
# 排查   : 日志按顺序确认 ——
#          [I][app:...]  Project p4.full_test version R5    ← 确认烧的确实是 R5
#          [I][m3]: ES8388 DAC output BOTH enable = OK      ← 线输出使能成功
#          [I][m3]: ES8388 reg 0x04 = 0x3C / 0x17 = 0x18 / 0x18 = 0x02 / 0x19 = 0x20 /
#                   0x1A = 0x1B = 0x00 / 0x2E~0x31 = 0x1E    ← 18 条回读（R5 补齐）
#          [I][m3]: speaker start requested
#          [I][m3]: TONE #1 12800/12800 bytes running=1 buf_before=0   ← 每 4 声一行
#                   ★ buf_before 必须一直是 0（= 上一声还没被 DMA 取走的字节数）
#          [I][diag]: PA 扫描 1/4 -> LOW = 关闭 …… 4 轮后打 "PA 锁定 HIGH 常开"
#          另有 I2C scan 出 0x11 + 0x69、"Max Coord: 480 800"、TOUCH 日志滚动
#          ★ R6/R7 判据（每 25s 一轮，约 6s，期间测试音暂停）：
#            [I][m3]: MIC 探针② 采集 3 秒 —— 对着板上麦克风出声 / 拍手   ← 这 3 秒请出声或拍手
#            [I][m3]: MIC 回读：块数=N min=.. max=.. 跨度=..
#            R7 起探针会先补写 ADC 差分输入+I2S 格式+增益（回读 0x09/0x0A/0x0B/0x0C/0x16）
#            跨度 >500 ⇒ codec/时钟/电平全活，故障在模拟输出段（量测表 ①②）
#            有块但全 0 ⇒ ADC 差分+格式+增益补齐后仍 0 ⇒ codec 没在转换（铁证）
#                        ⇒ 量测表 ③④ + LRCK 直流分量（判 1.8V/3.3V IO 域）
#          ★ R7 新增试听旋律：每 10s 一段"哆-来-哆"三音上行（2667/2000/4000Hz），
#            与常驻 2kHz 测试音音高不同 —— 只要喇叭通路有任何一点声音，都能听出来。
#          ★ R8 旁路试听（每 30s 一窗，窗内约 8s，日志打 "SIDETONE ON … 请拍手"）：
#            ES8388 官方模拟旁路：LIN1(麦1信号)/RIN1(麦1基准) → 混音器(+6dB) → LOUT1/ROUT1
#            → C70/C71 → PAM8302A(差分) → 喇叭。**全程不经过 I2S/ADC/DAC**。
#            听到拍手回放或啸叫 ⇒ 模拟段+功放+喇叭全活 ⇒ 唯一断点 = I2S 接口（硬件）；
#            全程死寂 ⇒ codec 模拟段或功放/喇叭段故障（量 C70/C71→PAM→喇叭）。
#            （R7 的 melody 每 10s 轮已停用，避免干扰旁路听窗。）
# ============================================================
# ★★★ 2026-10-02 R4 —— 根因找到（读原理图第 6 页 "Audio codec" 得出，不是猜测）：
#   PAM8302A 的 +IN 与 −IN **都被驱动**，是「差分输入」：
#       LOUT1(pin12) ──C70 1µF── R56 10K ──► +IN(pin3)
#       ROUT1(pin11) ──C71 1µF── R57 10K ──► −IN(pin4)
#   它放大的是 (LOUT1 − ROUT1)。而 R3 用的 `channel: mono` 会让 I2S 的
#   slot_mask = BOTH ⇒ 同一个单声道采样同时送进左右两个 slot ⇒ LOUT1 与 ROUT1
#   波形完全一致 ⇒ 差值为 0 ⇒ 功放输入恒为 0 ⇒ 一点声音都没有。
#   改 `channel: left` ⇒ slot_mask = LEFT ⇒ 数据只进左 slot、右 slot 为 0
#   ⇒ LOUT1 出信号、ROUT1 只维持直流偏置 ⇒ 差分输入终于拿得到信号 ⇒ 出声。
#   ★ slot_mode 仍是 MONO（stream info 是编译期默认 1ch），PCM 格式与环缓都不变。
# ============================================================
# ★★ 2026-10-01 第三轮（第二轮修完仍无声）—— 已把所有软件可控变量逐条核对/试掉：
#   ① ES8388 配置已与三份 known-good 初始化序列逐寄存器对齐：
#      ESPHome es8388.cpp + ESP-ADF es8388.c + M5Stack ES8388 模块示例。
#      关键位逐位核对（ES8388S datasheet 配置寄存器总表）：
#        0x17 = 0x18 → DACWL[5:3]=011 (16bit) + DACFORMAT[2:0]=000 (I2S)   ✔
#        0x19  默认 0x22，DACMute = bit2(0x04)；码里写 0x20 → bit2=0 未静音 ✔
#        0x04  默认 0xC0 = PdnDACL+PdnDACR 都掉电、LOUT/ROUT 关闭；
#              DAC_OUTPUT_BOTH=0x3C 正好清掉两个 PDN 并打开 LOUT/ROUT   ✔
#        0x2E~0x31 = 0x1E 输出音量（★ 0x00 是最小音量，不是 0dB）        ✔
#   ② 数字链路已由日志证通：BEEP 12800/12800 + running=1 + 全程无 Stopped
#      （任务若写 I2S 失败会打 ERROR 并退出 ⇒ 没退出就说明 I2S 写入正常）。
#   ③ 于是本轮只剩一个由软件控制、且从未实测过的变量：**PA_EN(GPIO31) 极性**。
#      → 改成每触摸一次翻转一次（PA=HIGH / PA=LOW 交替），一次烧录同时试两种极性。
#      → 另外加了 11 个关键寄存器的回读日志（写入 OK ≠ 值真落进芯片）。
#   ★ 若两种极性都无声：软件侧已无可查项，问题在 ES8388 模拟输出之后（见 switch 段注释）。
