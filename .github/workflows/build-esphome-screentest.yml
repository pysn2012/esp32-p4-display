# 工作流名称
name: build esphome screentest

# 触发条件
on:
  workflow_dispatch:  # 手动触发（推荐）

jobs:
  compile-esphome:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取仓库代码
      - name: 拉取仓库代码
        uses: actions/checkout@v6

      # 步骤2：配置 Python 环境
      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          # esphome 2026.9.0 要求 Python >=3.12,<3.15（PyPI metadata 实锤）
          # 3.11 会装到 2026.6.5（2026.7.0+ 全部被跳过）→ 必须用 3.13
          python-version: '3.13'

      # 步骤3：安装 ESPHome
      - name: 安装 ESPHome
        run: |
          python -m pip install --upgrade pip
          # 必须锁定 2026.9.0：
          # 1) 本仓库 mipi_dsi 组件副本基于 2026.9.0（用了该版本的 API）
          # 2) 不锁版本时 CI 可能装到旧版 → AttributeError: transform_schema
          pip install esphome==2026.9.0

      # 步骤4：编译固件
      - name: 编译固件
        run: |
          # 进入配置文件目录
          cd esphome
          # 编译固件，生成bin文件
          esphome compile screen_test.yaml

      # 步骤5：动态查找编译产物
      - name: 动态查找 firmware.bin
        id: find_fw
        run: |
          SEARCH_ROOT="esphome/.esphome/build"   # 与编译目录对应
          OTA=$(find "$SEARCH_ROOT" -name "firmware.ota.bin" | head -n 1)
          FACTORY=$(find "$SEARCH_ROOT" -name "firmware.factory.bin" | head -n 1)
          ELF=$(find "$SEARCH_ROOT" -name "firmware.elf" | head -n 1)

          echo "OTA=$OTA" >> $GITHUB_OUTPUT
          echo "FACTORY=$FACTORY" >> $GITHUB_OUTPUT
          echo "ELF=$ELF" >> $GITHUB_OUTPUT

      # 步骤6：上传固件
      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: esphome-${{ github.sha }}
          path: |
            ${{ steps.find_fw.outputs.OTA }}
            ${{ steps.find_fw.outputs.FACTORY }}
            ${{ steps.find_fw.outputs.ELF }}
            esphome/screen_test.yaml
          # 产物缺失时显式失败，避免静默上传空包
          if-no-files-found: error
          retention-days: 30
